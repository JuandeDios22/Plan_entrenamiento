<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="20 de febrero">
<meta name="description" content="Plan de fuerza y carrera hasta el 20 de febrero.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F3EFF0'/%3E%3Ctext y='.88em' x='10' font-size='78'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">
<title>Camino al 20 de Febrero</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3EFF0; --surface:#FFFFFF; --surface-2:#FAF7F8; --line:#E5DADE; --line-soft:#EFE7EA;
  --ink:#221A1E; --muted:#7A6A70; --faint:#A99AA0;
  --wine:#8E2F4A; --wine-soft:#F7E3E9; --wine-ink:#6E2239;
  --teal:#1C6B76; --teal-soft:#DEEDEF;
  --sage:#4E7C5B; --sage-soft:#E2EEE5;
  --amber:#9E6A15; --amber-soft:#F6EBD6;
  --shadow:0 1px 2px rgba(34,26,30,.05), 0 8px 24px -16px rgba(34,26,30,.25);
  --r:14px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151114; --surface:#1E181B; --surface-2:#241D21; --line:#31272B; --line-soft:#2A2226;
    --ink:#F0E7EA; --muted:#A3919A; --faint:#786870;
    --wine:#E5809A; --wine-soft:#3A222B; --wine-ink:#F2AFC0;
    --teal:#66B5C1; --teal-soft:#1B2E32;
    --sage:#8CBE9C; --sage-soft:#1E2B22;
    --amber:#D9A24A; --amber-soft:#2E2517;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#151114; --surface:#1E181B; --surface-2:#241D21; --line:#31272B; --line-soft:#2A2226;
  --ink:#F0E7EA; --muted:#A3919A; --faint:#786870;
  --wine:#E5809A; --wine-soft:#3A222B; --wine-ink:#F2AFC0;
  --teal:#66B5C1; --teal-soft:#1B2E32;
  --sage:#8CBE9C; --sage-soft:#1E2B22;
  --amber:#D9A24A; --amber-soft:#2E2517;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5;
  margin:0; padding:0 16px 120px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:600px;margin:0 auto}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* ---------- header ---------- */
header{padding-block:20px 12px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:23px;letter-spacing:-.01em}
.count{text-align:right;flex:none}
.count .n{font-family:"Fraunces",Georgia,serif;font-size:34px;font-weight:700;line-height:1;color:var(--wine);font-variant-numeric:tabular-nums}
.count .l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.track{height:5px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.track > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--wine))}
.trackmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:18px}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;
  padding:8px 4px;border-radius:99px;cursor:pointer;transition:background .15s,color .15s;
}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}

/* session head */
.shead{display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--line-soft)}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav .d{font-size:12.5px;color:var(--muted);font-weight:600}
.arrow{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;flex:none}
.arrow:hover{color:var(--ink);border-color:var(--faint)}
.arrow:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.stitle{font-size:25px;letter-spacing:-.015em}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:99px;text-transform:uppercase}
.pill.strength{background:var(--wine-soft);color:var(--wine-ink)}
.pill.run{background:var(--teal-soft);color:var(--teal)}
.pill.rest{background:var(--sage-soft);color:var(--sage)}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.done{background:var(--sage);color:#fff}
:root[data-theme="dark"] .pill.done,:root:not([data-theme="light"]) .pill.done{color:#15201A}

/* block */
.block{border-top:1px solid var(--line-soft)}
.block:first-of-type{border-top:0}
.blabel{display:flex;align-items:center;gap:8px;padding:13px 16px 4px}
.blabel .eyebrow{color:var(--faint)}
.blabel .mins{margin-left:auto;font-size:11px;color:var(--faint)}

.ex{display:flex;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft);align-items:flex-start}
.block .ex:first-of-type{border-top:0}
.ex.done .exname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.exmain{flex:1;min-width:0}
.exname{font-weight:600;font-size:14.5px;line-height:1.3;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.vid{
  display:inline-grid;place-items:center;width:21px;height:21px;border-radius:99px;flex:none;
  border:1px solid var(--line);background:var(--surface-2);color:var(--wine);
  font-size:8px;line-height:1;text-decoration:none;transition:background .15s,border-color .15s,transform .12s;
}
.vid:hover{background:var(--wine-soft);border-color:var(--wine);transform:scale(1.08)}
.vid:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.vid svg{width:9px;height:9px;display:block}
.exmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.exmeta b{color:var(--wine);font-weight:700;font-family:"IBM Plex Mono",monospace;font-size:12px}
.exnote{font-size:12px;color:var(--faint);margin-top:4px;line-height:1.4}
.exright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.sets{display:flex;gap:5px}
.setbtn{
  width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);
  cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--faint);
  display:grid;place-items:center;padding:0;transition:transform .12s,background .15s,border-color .15s,color .15s;
}
.setbtn:hover{border-color:var(--wine)}
.setbtn:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.setbtn[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff;transform:scale(.94)}
:root[data-theme="dark"] .setbtn[aria-pressed="true"],:root:not([data-theme="light"]) .setbtn[aria-pressed="true"]{color:#1B1013}
.wgt{display:flex;align-items:center;gap:4px}
.wgt input{
  width:52px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right;
}
.wgt input:focus{outline:2px solid var(--wine);outline-offset:1px}
.wgt span{font-size:10.5px;color:var(--faint)}

.runstep{display:flex;gap:11px;padding:9px 16px;border-top:1px solid var(--line-soft);align-items:baseline}
.block .runstep:first-of-type{border-top:0}
.runstep .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--teal);font-weight:600;flex:none;width:22px}
.runstep .v{font-size:14px;flex:1}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  color:var(--ink);font-family:inherit;font-size:14px;
}
.field input.mono{font-family:"IBM Plex Mono",monospace}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--wine);outline-offset:1px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:13px 16px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;
}
.btn:hover{opacity:.88}
.btn:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:var(--faint)}
.btn.isdone{background:var(--sage);border-color:var(--sage);color:#fff}
:root[data-theme="dark"] .btn.isdone,:root:not([data-theme="light"]) .btn.isdone{color:#121A14}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:10px;width:auto}

/* calendar */
.month{margin-bottom:6px}
.mname{font-family:"Fraunces",Georgia,serif;font-size:15px;font-weight:600;margin:0 0 8px;text-transform:capitalize}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.dow span{text-align:center;font-size:9.5px;color:var(--faint);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{
  aspect-ratio:1;border-radius:9px;border:1px solid transparent;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);padding:0;
}
.day.empty{background:transparent;cursor:default}
.day.out{opacity:.28;cursor:default}
.day .dot{width:5px;height:5px;border-radius:99px;background:var(--wine);opacity:.55}
.day.run .dot{background:var(--teal)}
.day.rest .dot{background:var(--sage)}
.day.done{background:var(--wine);color:#fff;border-color:var(--wine)}
.day.done.run{background:var(--teal);border-color:var(--teal)}
.day.done .dot{background:#fff;opacity:.85}
:root[data-theme="dark"] .day.done,:root:not([data-theme="light"]) .day.done{color:#1B1013}
:root[data-theme="dark"] .day.done .dot,:root:not([data-theme="light"]) .day.done .dot{background:#1B1013}
.day.today{border-color:var(--ink);border-width:2px}
.day:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);padding-top:4px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;vertical-align:middle}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:14px 10px;text-align:center}
.stat .v{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.05em;text-transform:uppercase}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding:0 2px}
.bars .b{flex:1;background:var(--wine-soft);border-radius:5px 5px 0 0;position:relative;min-height:3px;display:flex;justify-content:center}
.bars .b.last{background:var(--wine)}
.bars .b span{position:absolute;top:-16px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}
.barx{display:flex;gap:6px;padding:6px 2px 0}
.barx span{flex:1;text-align:center;font-size:9.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.row:first-child{border-top:0}
.row .rk{color:var(--muted);flex:1;min-width:0}
.row .rv{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;flex:none}

.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.note b{color:var(--ink)}
.callout{background:var(--amber-soft);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--ink)}
.callout .eyebrow{color:var(--amber);margin-bottom:3px;display:block}

/* timer bar */
.timerbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -18px rgba(0,0,0,.5);
  transform:translateY(110%);transition:transform .25s ease;
}
.timerbar.on{transform:translateY(0)}
.timerinner{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tnum{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;color:var(--wine);min-width:72px;font-variant-numeric:tabular-nums}
.tmeta{flex:1;min-width:0}
.tmeta .t1{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta .t2{font-size:11px;color:var(--muted)}
.tbtns{display:flex;gap:6px;flex:none}
.tbtns button{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.tbtns button:hover{color:var(--ink)}
.tbtns button:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

details.acc{border-top:1px solid var(--line-soft)}
details.acc summary{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";margin-left:auto;color:var(--faint);font-family:"IBM Plex Mono",monospace}
details.acc[open] summary::after{content:"–"}
details.acc .body{padding:0 16px 14px}
.card.pad > details.acc > summary{padding-left:0;padding-right:0}
.card.pad > details.acc > .body{padding-left:0;padding-right:0}

hr.sep{border:0;border-top:1px solid var(--line);margin:22px 0 16px}
footer{padding:26px 0 10px;text-align:center;font-size:11.5px;color:var(--faint);line-height:1.6}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){
  .exright{gap:5px}
  .setbtn{width:24px;height:24px}
  .count .n{font-size:30px}
}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brandrow">
      <div class="brand">
        <div class="eyebrow">Plan de fuerza y carrera</div>
        <h1>Camino al 20 de febrero</h1>
      </div>
      <div class="count">
        <div class="n mono" id="cdays">—</div>
        <div class="l">días para la boda</div>
      </div>
    </div>
    <div>
      <div class="track"><i id="ptrack" style="width:0%"></i></div>
      <div class="trackmeta"><span id="pphase">—</span><span id="ppct">—</span></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-hoy" aria-selected="true" aria-controls="v-hoy">Hoy</button>
    <button role="tab" id="tab-plan" aria-selected="false" aria-controls="v-plan">Calendario</button>
    <button role="tab" id="tab-prog" aria-selected="false" aria-controls="v-prog">Progreso</button>
    <button role="tab" id="tab-guia" aria-selected="false" aria-controls="v-guia">Guía</button>
  </nav>

  <section id="v-hoy" role="tabpanel" aria-labelledby="tab-hoy" class="stack"></section>
  <section id="v-plan" role="tabpanel" aria-labelledby="tab-plan" class="stack" hidden></section>
  <section id="v-prog" role="tabpanel" aria-labelledby="tab-prog" class="stack" hidden></section>
  <section id="v-guia" role="tabpanel" aria-labelledby="tab-guia" class="stack" hidden></section>

  <footer>Hecho con cariño para llegar al 20 de febrero fuerte y entera.<br>Los datos se guardan en este dispositivo.</footer>
</div>

<div class="timerbar" id="timerbar">
  <div class="timerinner">
    <div class="tnum" id="tnum">0:00</div>
    <div class="tmeta">
      <div class="t1" id="tlabel">Descanso</div>
      <div class="t2" id="tsub">Serie completada</div>
    </div>
    <div class="tbtns">
      <button type="button" id="tplus">+15 s</button>
      <button type="button" id="tstop">Saltar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   1. CALENDARIO BASE
   ============================================================ */
const START = "2026-09-11";
const WEDDING = "2027-02-20";
const P2 = "2026-10-26";          // inicio fase 2
const P3 = "2027-01-25";          // inicio fase 3
const FIRST_MONDAY = "2026-09-14";

const DAY = 86400000;
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const diffDays = (a,b) => Math.round((parseISO(b) - parseISO(a)) / DAY);
const addDays = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const todayISO = () => iso(new Date());

const DOW_LONG = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const fmtLong = s => { const d = parseISO(s); return cap(`${DOW_LONG[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`); };
const fmtShort = s => { const d = parseISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };

const isRunDay = s => { const w = parseISO(s).getDay(); return w === 1 || w === 4; };
const inPlan = s => diffDays(START, s) >= 0 && diffDays(s, WEDDING) >= 0;

function phaseOf(s){
  if (diffDays(s, P2) > 0) return 0;
  if (diffDays(s, P3) > 0) return 1;
  return 2;
}

/* Índice de la sesión de fuerza: cuenta los días que no son lunes ni jueves */
function strengthIndex(s){
  const n = diffDays(START, s);
  let c = 0;
  for (let i = 0; i < n; i++) if (!isRunDay(addDays(START, i))) c++;
  return c;                       // 0-based
}
function cycleInfo(s){
  const i = strengthIndex(s);
  return { session: (i % 10) + 1, cycle: Math.floor(i / 10) + 1, posInCycle: (i % 10) + 1 };
}
function runWeek(s){
  return Math.floor(diffDays(FIRST_MONDAY, s) / 7) + 1;   // 1-based
}

/* --- temporizador de descanso --- */
let timer = {left:0, id:null, label:""};
const bar = () => document.getElementById("timerbar");
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    const ctx = new Ctx(); const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type = "sine"; o.frequency.value = 740;
    g.gain.setValueAtTime(.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.22, ctx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .5);
    o.start(); o.stop(ctx.currentTime + .55);
    setTimeout(() => ctx.close(), 900);
  }catch(e){}
  if (navigator.vibrate) { try { navigator.vibrate([120, 60, 120]); } catch(e){} }
}
function paintTimer(){
  const m = Math.floor(timer.left / 60), sec = timer.left % 60;
  document.getElementById("tnum").textContent = `${m}:${String(sec).padStart(2,"0")}`;
}
function startRest(seconds, label){
  timer.left = seconds; timer.label = label;
  document.getElementById("tlabel").textContent = label;
  document.getElementById("tsub").textContent = "Descanso entre series";
  bar().classList.add("on"); paintTimer();
  clearInterval(timer.id);
  timer.id = setInterval(() => {
    timer.left--;
    if (timer.left <= 0){ clearInterval(timer.id); paintTimer(); beep();
      document.getElementById("tsub").textContent = "¡Siguiente serie!";
      setTimeout(() => bar().classList.remove("on"), 2500);
    } else paintTimer();
  }, 1000);
}
document.getElementById("tstop").onclick = () => { clearInterval(timer.id); bar().classList.remove("on"); };
document.getElementById("tplus").onclick = () => { timer.left += 15; paintTimer(); };

/* descanso recomendado según el ejercicio */
function restFor(ex, sess){
  if (sess && sess.circuit) return 40;
  if (sess && sess.easy) return 20;
  if (/s$/.test(String(ex.r[0])) || /\bs\b/.test(String(ex.r[0]))) return 45;
  return ["hip","hip2","goblet","goblet_p","rdl","bulgarian","row","pushup","ohp","sumo","stepup"].includes(ex.id) ? 75 : 50;
}

function renderSession(){
  const box = document.getElementById("v-hoy");

  const head = el("div","shead");

  prev.disabled = diffDays(START, d) <= 0; next.disabled = diffDays(d, WEDDING) <= 0;
  prev.onclick = () => { viewDate = addDays(viewDate, -1); renderSession(); };
  next.onclick = () => { viewDate = addDays(viewDate, 1); renderSession(); };
  const dlabel = el("div","d", fmtLong(d) + (d === todayISO() ? " · hoy" : ""));
  nav.append(prev, dlabel, next);

  const ci = cycleInfo(d);
  const title = el("h2","stitle");
  const pills = el("div","pills");

  if (sp){
    title.textContent = sp.t;
    pills.append(pillOf(sp.kind === "wedding" ? "strength" : "rest", sp.tag));
    if (sp.kind !== "wedding") pills.append(pillOf("ghost","Sin entrenamiento"));
  } else if (run){
    const r = runFor(d);
    title.textContent = r.t;
    pills.append(pillOf("run","Carrera · 1 h"), pillOf("ghost", `Semana ${r.week}`), pillOf("ghost", PHASES[ph].name.split(" · ")[1]));
  } else {
    const sess = SESSIONS[ci.session - 1];
    title.textContent = sess.t;
    pills.append(
      pillOf(sess.easy ? "rest" : "strength", `Sesión ${ci.session}/10`),
      pillOf("ghost", `Ciclo ${ci.cycle}`),
      pillOf("ghost", sess.mins),
      pillOf("ghost", PHASES[ph].name.split(" · ")[1])
    );
  }
  if (st.done) pills.append(pillOf("done","Hecha ✓"));
  head.append(nav, title, pills);
  card.append(head);

  if (sp){
    const b = el("div","block");
    blockLabel(b, sp.kind === "wedding" ? "20 de febrero de 2027" : "El día antes");
    sp.body.forEach((t, i) => {
      const r = el("div","runstep");
      r.append(el("span","k", sp.kind === "wedding" ? "♥" : "·"), el("span","v", t));
      b.append(r);
    });
    card.append(b);
  }
  else if (run) buildRun(card, d, ph);
  else buildStrength(card, d, ph, SESSIONS[ci.session - 1], ci);

  box.append(card);

  if (sp && sp.kind === "wedding"){ renderPhaseNote(box, ph); return; }

  /* --- botón de completar --- */
  const doneBtn = el("button", "btn" + (st.done ? " isdone" : ""), st.done ? "Sesión completada ✓" : "Marcar sesión como hecha");
  doneBtn.type = "button";
  doneBtn.onclick = () => {
    st.done = !st.done; save();
    if (st.done) toast(streakText());
    renderSession(); renderProgress(); renderCalendar();
  };
  box.append(doneBtn);

  /* --- pasos y nota del día --- */

  si.value = S.steps[d] != null ? S.steps[d] : ""; si.placeholder = "desde la app Salud del iPhone";
  si.oninput = () => {
    const v = parseInt(String(si.value).replace(/\D/g,""), 10);
    if (isNaN(v)) delete S.steps[d]; else S.steps[d] = v;
    save(); renderProgress();
  };
  sf.append(sl, si);

function buildStrength(card, d, ph, sess, ci){
  const st = dayState(d);

  /* calentamiento */
  const w = el("div","block");
  blockLabel(w, "Calentamiento", "3-4 min");
  sess.warm.forEach((t, i) => {
    const r = el("div","runstep");
    r.append(el("span","k","·"), el("span","v", t));
    w.append(r);
  });
  card.append(w);

  /* principal */
  const m = el("div","block");
  blockLabel(m, sess.circuit ? `Circuito · ${sess.circuit.rounds[ph]} vueltas` : "Bloque principal",
                sess.circuit ? `${sess.circuit.rest[ph]} entre vueltas` : sess.mins);
  sess.main.forEach(ex => m.append(exerciseRow(ex, ph, sess, ci, st, d)));
  card.append(m);

  /* test de flexiones */
  if (sess.main.some(e => e.pu)){
    const t = el("div","block");
    blockLabel(t, "Test del ciclo");
    const row = el("div","ex");
    const main = el("div","exmain");
    main.append(el("div","exname","Máximo de flexiones completas seguidas"));
    main.append(el("div","exnote","Al final de la sesión, una serie al máximo con buena técnica. Se apunta y se compara ciclo a ciclo."));
    const right = el("div","exright");
    const wrap = el("div","wgt");
    const inp = el("input"); inp.type = "number"; inp.min = "0"; inp.inputMode = "numeric";
    inp.id = "test-" + d; inp.value = S.tests[d] != null ? S.tests[d] : "";
    inp.placeholder = "0";
    inp.oninput = () => { if (inp.value === "") delete S.tests[d]; else S.tests[d] = Math.max(0, parseInt(inp.value, 10) || 0); save(); renderProgress(); };
    wrap.append(inp, el("span","","reps"));
    right.append(wrap);
    row.append(main, right);
    t.append(row);
    card.append(t);
  }

  /* vuelta a la calma */
  const c = el("div","block");
  blockLabel(c, "Vuelta a la calma", "2-3 min");
  sess.cool.forEach(t => { const r = el("div","runstep"); r.append(el("span","k","·"), el("span","v", t)); c.append(r); });
  card.append(c);

  if (sess.tip){
    const dt = el("details","acc");
    dt.innerHTML = `<summary>Nota de esta sesión</summary><div class="body"><p class="note" style="margin:0">${sess.tip}</p></div>`;
    card.append(dt);
  }

function exerciseRow(ex, ph, sess, ci, st, d){
  const row = el("div","ex");
  const pu = ex.pu ? pushupFor(ci.cycle) : null;
  const name = pu ? pu.n : ex.n;
  const sets = pu ? pu.s : ex.s[ph];
  const reps = pu ? pu.r : ex.r[ph];
  const note = pu ? pu.note : ex.note;

  const done = st.c[ex.id] || 0;
  if (done >= sets) row.classList.add("done");

  const main = el("div","exmain");
  const nameRow = el("div","exname", name);
  const q = pu ? PUSH_VID[Math.min(ci.cycle, PUSH_VID.length) - 1] : VID[ex.id];
  if (q) nameRow.append(videoLink(q, name));
  main.append(nameRow);
  const meta = el("div","exmeta");
  meta.innerHTML = sess.circuit ? `<b>${reps}</b>` : `<b>${sets} × ${reps}</b>`;
  main.append(meta);
  if (note) main.append(el("div","exnote", note));

  const right = el("div","exright");
  const sbox = el("div","sets");
  for (let i = 1; i <= sets; i++){
    const b = el("button","setbtn", String(i));
    b.type = "button";
    b.setAttribute("aria-pressed", i <= done ? "true" : "false");
    b.setAttribute("aria-label", `Serie ${i} de ${name}`);
    b.onclick = () => {
      const cur = st.c[ex.id] || 0;
      st.c[ex.id] = (i === cur) ? i - 1 : i;
      save();
      if (st.c[ex.id] > cur && st.c[ex.id] < sets) startRest(restFor(ex, sess), name);
      else if (st.c[ex.id] >= sets) { toast("Ejercicio completo"); clearInterval(timer.id); bar().classList.remove("on"); }
      renderSession();
    };
    sbox.append(b);
  }
  right.append(sbox);

  if (ex.w){
    const wrap = el("div","wgt");
    const inp = el("input"); inp.type = "text"; inp.inputMode = "decimal";
    inp.id = "w-" + d + "-" + ex.id;

    inp.oninput = () => { (st.w ||= {})[ex.id] = inp.value; if (inp.value.trim()) S.loads[ex.id] = inp.value.trim(); save(); };
    wrap.append(inp, el("span","","kg"));
    right.append(wrap);
  }

  row.append(main, right);
  return row;
}

function streakCount(){
  let n = 0, d = todayISO();
  if (!(S.days[d] || {}).done) d = addDays(d, -1);
  while (inPlan(d) && (S.days[d] || {}).done){ n++; d = addDays(d, -1); }
  return n;
}
function streakText(){
  const n = streakCount();
  return n <= 1 ? "¡Hecho! Racha de 1 día" : `¡Hecho! Racha de ${n} días`;
}
function renderProgress(){
  const box = document.getElementById("v-prog");
  box.innerHTML = "";

  const doneDays = Object.keys(S.days).filter(k => S.days[k].done && inPlan(k));
  const runs = doneDays.filter(isRunDay);
  const strength = doneDays.filter(k => !isRunDay(k) && !SPECIAL[k]);
  let km = 0, mins = 0;
  Object.keys(S.days).forEach(k => {
    const r = S.days[k].run || {};
    const v = parseFloat(String(r.km || "").replace(",", ".")); if (!isNaN(v)) km += v;
    const t = parseFloat(String(r.min || "").replace(",", ".")); if (!isNaN(t)) mins += t;
  });

  const stats = el("div","stats");
  stats.append(statTile(streakCount(), "días de racha"), statTile(strength.length, "sesiones de fuerza"), statTile(runs.length, "carreras"));
  box.append(stats);

  const stats2 = el("div","stats");
  stats2.append(
    statTile(km ? km.toFixed(1) : "0", "km corridos"),
    statTile(mins ? Math.round(mins / 60) + " h" : "0 h", "corriendo"),
    statTile(cycleInfo(todayISO()).cycle > 12 ? 12 : cycleInfo(todayISO()).cycle, "ciclo actual")
  );
  box.append(stats2);

  /* ciclo actual */
  const ci = cycleInfo(todayISO());
  const cyCard = el("div","card pad");
  const cycStart = (() => { let d = START, seen = 0; while (inPlan(d)){ if (!isRunDay(d)){ if (Math.floor(seen / 10) + 1 === ci.cycle && seen % 10 === 0) return d; seen++; } d = addDays(d, 1); } return START; })();
  let cDone = 0, probe = cycStart, count = 0;
  while (inPlan(probe) && count < 10){
    if (!isRunDay(probe)){ if ((S.days[probe] || {}).done) cDone++; count++; }
    probe = addDays(probe, 1);
  }
  cyCard.innerHTML = `<div class="eyebrow">Ciclo ${ci.cycle} de 12</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin:6px 0 10px">
      <span class="mono" style="font-size:26px;font-weight:600">${cDone}/10</span>
      <span class="note">sesiones de fuerza completadas</span>
    </div>
    <div class="track"><i style="width:${cDone * 10}%"></i></div>`;
  box.append(cyCard);

  /* test de flexiones */
  const tks = Object.keys(S.tests || {}).filter(inPlan).sort();
  const puCard = el("div","card pad");
  puCard.append(el("div","eyebrow","Flexiones completas · test de cada ciclo"));
  if (tks.length === 0){
    const p = el("p","note","Todavía sin datos. El test se apunta en la sesión 3 de cada ciclo, la de empuje. Empezamos desde flexiones con rodillas y el objetivo es llegar a 5 completas seguidas antes de la boda.");
    p.style.margin = "8px 0 0"; puCard.append(p);
  } else {
    const vals = tks.map(k => S.tests[k]);
    const max = Math.max(5, ...vals);
    const bars = el("div","bars"); bars.style.marginTop = "18px";
    const xs = el("div","barx");
    tks.slice(-8).forEach((k, i, arr) => {
      const v = S.tests[k];
      const b = el("div","b" + (i === arr.length - 1 ? " last" : ""));
      b.style.height = Math.max(4, (v / max) * 88) + "px";
      b.append(el("span","", String(v)));
      bars.append(b);
      xs.append(el("span","", fmtShort(k)));
    });
    puCard.append(bars, xs);
  }
  box.append(puCard);

  /* pesos actuales */
  const lk = Object.keys(S.loads || {});
  if (lk.length){
    const lw = el("div","card pad");
    lw.append(el("div","eyebrow","Últimos pesos usados"));
    const rows = el("div","rows"); rows.style.marginTop = "6px";
    const names = {};
    SESSIONS.forEach(s => s.main.forEach(e => names[e.id] = e.n));
    lk.forEach(k => {
      const r = el("div","row");
      r.append(el("span","rk", names[k] || k), el("span","rv", S.loads[k] + " kg"));
      rows.append(r);
    });
    lw.append(rows);
    box.append(lw);
  }

  /* pasos y salud */
  const stCard = el("div","card pad");
  stCard.append(el("div","eyebrow","Pasos · últimos 7 días"));
  const last7 = []; for (let i = 6; i >= 0; i--) last7.push(addDays(todayISO(), -i));
  const svals = last7.map(k => (S.steps || {})[k] || 0);
  const sany = svals.some(v => v > 0);
  if (!sany){
    const p0 = el("p","note","Todavía sin pasos. Apúntalos cada día en la pestaña Hoy, o pega de golpe una semana entera desde la app Salud del iPhone con el botón de abajo. En la Guía está el atajo para que lo haga solo.");
    p0.style.margin = "8px 0 0"; stCard.append(p0);
  } else {
    const smax = Math.max(...svals);
    const media = Math.round(svals.filter(v => v > 0).reduce((a,b) => a+b, 0) / svals.filter(v => v > 0).length);
    const mrow = el("div",""); mrow.style.cssText = "display:flex;align-items:baseline;gap:8px;margin:6px 0 2px";
    const mv = el("span","mono", media.toLocaleString("es-ES")); mv.style.cssText = "font-size:26px;font-weight:600";
    mrow.append(mv, el("span","note","pasos de media al día"));
    stCard.append(mrow);
    const bars = el("div","bars"); bars.style.marginTop = "22px";
    const xs = el("div","barx");
    last7.forEach((k, i) => {
      const v = svals[i];
      const b = el("div","b" + (i === 6 ? " last" : ""));
      b.style.height = Math.max(4, (v / smax) * 88) + "px";
      if (v) b.append(el("span","", (v/1000).toFixed(1).replace(".0","") + "k"));
      bars.append(b);
      xs.append(el("span","", ["D","L","M","X","J","V","S"][parseISO(k).getDay()]));
    });
    stCard.append(bars, xs);
  }
  const impWrap = el("details","acc");
  impWrap.style.marginTop = "12px";
  const sum = el("summary","","Pegar datos de la app Salud");
  const bodyD = el("div","body");
  const tip = el("p","note","Una línea por día, con la fecha y los pasos. Vale <b>2026-09-11 8432</b> o <b>11/09/2026 8432</b>. Si pegas solo un número, se guarda en el día de hoy.");
  tip.style.margin = "0 0 8px";
  const tai = el("textarea"); tai.rows = 4; tai.id = "stepsimport";
  tai.placeholder = "11/09/2026 8432\n12/09/2026 10250";
  tai.style.cssText = "width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px";
  const impBtn = el("button","btn sm ghost","Importar pasos"); impBtn.type = "button";
  impBtn.style.cssText = "width:100%;margin-top:8px";
  impBtn.onclick = () => {
    const lines = tai.value.split(/\n+/).map(x => x.trim()).filter(Boolean);
    let n = 0;
    lines.forEach(line => {
      const m = line.match(/^(\d{4}-\d{2}-\d{2}|\d{1,2}[\/-]\d{1,2}[\/-]\d{4})\D+([\d.,\s]+)$/);
      if (m){
        let day = m[1];
        if (day.includes("/") || (day.includes("-") && day.length <= 10 && !/^\d{4}/.test(day))){
          const [dd, mm, yy] = day.split(/[\/-]/);
          day = `${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
        }
        const v = parseInt(m[2].replace(/\D/g,""), 10);
        if (!isNaN(v) && /^\d{4}-\d{2}-\d{2}$/.test(day)){ (S.steps ||= {})[day] = v; n++; }
      } else {
        const v = parseInt(line.replace(/\D/g,""), 10);
        if (!isNaN(v)){ (S.steps ||= {})[todayISO()] = v; n++; }
      }
    });
    if (n){ save(); tai.value = ""; renderProgress(); renderSession(); toast(n === 1 ? "1 día importado" : n + " días importados"); }
    else toast("No he reconocido ninguna línea");
  };
  bodyD.append(tip, tai, impBtn);
  impWrap.append(sum, bodyD);
  stCard.append(impWrap);
  box.append(stCard);

  /* compartir */
  const sh = el("div","card pad");
  sh.append(el("div","eyebrow","Compartir"));
  const p = el("p","note","Copia un resumen para mandárselo a Juande, o guarda una copia de seguridad de todo el historial para pasarlo a otro móvil.");
  p.style.margin = "8px 0 12px";
  const btns = el("div","grid2");
  const b1 = el("button","btn sm ghost","Copiar resumen"); b1.type = "button";
  b1.onclick = () => {
    const txt = `Camino al 20 de febrero · ${fmtLong(todayISO())}\n`
      + `Racha: ${streakCount()} días\n`
      + `Fuerza: ${strength.length} sesiones · Carreras: ${runs.length}\n`
      + `Kilómetros: ${km.toFixed(1)} km\n`
      + `Ciclo ${ci.cycle}/12 — ${cDone}/10 sesiones\n`
      + (tks.length ? `Flexiones completas: ${S.tests[tks[tks.length-1]]}\n` : "")
      + `Faltan ${Math.max(0, diffDays(todayISO(), WEDDING))} días.`;
    copy(txt, "Resumen copiado");
  };
  const b2 = el("button","btn sm ghost","Copia de seguridad"); b2.type = "button";
  b2.onclick = () => copy(JSON.stringify(S), "Copia copiada. Pégala en el otro dispositivo con «Restaurar».");
  btns.append(b1, b2);
  const b3 = el("button","btn sm ghost","Restaurar desde una copia"); b3.type = "button";
  b3.style.width = "100%"; b3.style.marginTop = "10px";
  b3.onclick = () => {
    const t = window.prompt("Pega aquí la copia de seguridad:");
    if (!t) return;
    try { const o = JSON.parse(t); S = Object.assign({days:{}, loads:{}, tests:{}, steps:{}}, o); save(); renderAll(); toast("Historial restaurado"); }
    catch(e){ toast("Ese texto no es una copia válida"); }
  };
  sh.append(p, btns, b3);
  box.append(sh);
}
function statTile(v, k){
  const t = el("div","stat");
  t.append(el("div","v mono", String(v)), el("div","k", k));
  return t;
}
function copy(txt, ok){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => toast(ok), () => fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    try { document.execCommand("copy"); toast(ok); } catch(e){ toast("No se pudo copiar"); }
    ta.remove();
  }
}

/* ============================================================
   10. VISTA: GUÍA
   ============================================================ */
function renderGuide(){
  const box = document.getElementById("v-guia");
  if (box.dataset.built) return;
  box.dataset.built = "1";

  const intro = el("div","card pad");
  intro.innerHTML = `<div class="eyebrow">De qué va este plan</div>
    <h3 style="font-size:19px;margin:8px 0 10px">Fuerza de verdad, en media hora</h3>
    <p class="note">Cinco meses, 115 sesiones de fuerza y 46 carreras. No hay báscula ni dietas: el objetivo es <b>ganar músculo y fuerza</b>, y que se note en piernas, glúteo y abdomen. El peso puede subir un poco mientras la ropa queda mejor; es lo normal cuando se gana músculo.</p>
    <p class="note" style="margin-top:10px">Las repeticiones se hacen <b>cerca del esfuerzo</b>: al terminar una serie deberían quedar una o dos repeticiones en el depósito, no diez. Ese es el estímulo que hace que el músculo crezca.</p>`;

  const phases = el("div","card");
  const ph = el("div","pad");
  ph.innerHTML = `<div class="eyebrow">Las tres fases</div>`;
  const rows = el("div","rows"); rows.style.marginTop = "8px";
  [["Fase 1 · Base","11 sep – 25 oct","Técnica y adaptación. 12-15 repeticiones con peso cómodo. Flexiones de rodillas."],
   ["Fase 2 · Fuerza","26 oct – 24 ene","El bloque largo. 8-10 repeticiones con más peso, glúteo a tope. Aparecen las flexiones completas."],
   ["Fase 3 · Pulido","25 ene – 20 feb","Más repeticiones y menos descanso. La última semana es muy suave: llegar fresca al 20."]
  ].forEach(([a,b,c]) => {
    const r = el("div","row"); r.style.flexDirection = "column"; r.style.gap = "3px"; r.style.alignItems = "stretch";
    const top = el("div",""); top.style.display = "flex"; top.style.justifyContent = "space-between"; top.style.gap = "10px";
    top.append(el("span","", a), el("span","rv", b));
    top.firstChild.style.fontWeight = "700";
    r.append(top, el("span","note", c));
    rows.append(r);
  });
  ph.append(rows); phases.append(ph);

  const rules = el("div","card pad");
  rules.innerHTML = `<div class="eyebrow">Cinco reglas</div>`;
  const rl = el("div","rows"); rl.style.marginTop = "6px";
  [["Sube cuando te sobren repeticiones","Si terminas la última serie con dos o tres de margen, sube 1-2 kg por mancuerna el ciclo siguiente. Si no, repite el mismo peso."],
   ["El día malo no se fuerza","Si duermes mal o tienes agujetas fuertes, cambia la sesión por la número 10 (movilidad). No se pierde el ciclo, solo se desplaza un día."],
   ["Come proteína","Sin material de construcción no hay músculo. Aproximadamente 1,6 g por kilo al día: para 55 kg son unos 85-90 g repartidos entre las comidas."],
   ["Descansa entre series","45 segundos en abdomen y accesorios, 75-90 en lo pesado (hip thrust, sentadilla, remo, flexiones). El temporizador salta solo al marcar cada serie."],
   ["La carrera no es una carrera","Los lunes y jueves se sale a trotar, no a competir. Si no puedes hablar mientras corres, vas demasiado rápido."]
  ].forEach(([a,b]) => {
    const r = el("div","row"); r.style.flexDirection = "column"; r.style.gap = "3px"; r.style.alignItems = "stretch";
    const t = el("span","", a); t.style.fontWeight = "700";
    r.append(t, el("span","note", b));
    rl.append(r);
  });
  rules.append(rl);

  const eq = el("div","card pad");
  eq.innerHTML = `<div class="eyebrow">Material y trucos de casa</div>
    <p class="note" style="margin-top:8px">El botón ▶ que hay al lado de cada ejercicio abre un vídeo con la técnica, por si alguno no queda claro.</p>
    <p class="note" style="margin-top:8px">Todo se hace con <b>mancuernas regulables</b> y <b>bandas elásticas</b>. El sofá hace de banco para el hip thrust y de apoyo en la búlgara; una silla sirve para los fondos de tríceps y las subidas; el marco de una puerta sujeta la banda para el jalón.</p>
    <p class="note" style="margin-top:10px">Para el hip thrust: hombros en el borde del sofá, mancuerna sobre la cadera con una toalla doblada debajo para que no moleste.</p>`;

  const push = el("div","card pad");
  push.innerHTML = `<div class="eyebrow">El objetivo escondido</div>
    <h3 style="font-size:18px;margin:8px 0 8px">De cero a cinco flexiones</h3>
    <p class="note">Ahora mismo salen apoyando las rodillas. El plan sube por seis peldaños: rodillas → mesa → silla → escalón → negativas (solo la bajada, en 4-5 segundos) → completas. Cada ciclo toca un peldaño y se apunta el test en la sesión de empuje. <b>Si la técnica se rompe, se baja un peldaño</b>: es progreso, no un paso atrás.</p>`;

  const health = el("div","card pad");
  health.innerHTML = `<div class="eyebrow">Pasos y app Salud</div>
    <h3 style="font-size:18px;margin:8px 0 8px">Cómo traer los pasos del iPhone</h3>
    <p class="note">Una página web no puede leer sola la app Salud: los datos solo salen del iPhone si tú los sacas. Hay dos maneras.</p>
    <p class="note" style="margin-top:10px"><b>A mano.</b> Abre Salud, mira los pasos del día y escríbelos en la pestaña Hoy. Diez segundos.</p>
    <p class="note" style="margin-top:10px"><b>Con un atajo.</b> Una vez por semana, y lo hace solo:</p>
    <ol class="note" style="margin:8px 0 0;padding-left:18px;line-height:1.7">
      <li>Abre la app <b>Atajos</b> → <b>+</b> para crear uno nuevo.</li>
      <li>Añade la acción <b>Buscar muestras de salud</b>. Tipo: <b>Pasos</b>. Agrupar por: <b>Día</b>. Rango: <b>últimos 7 días</b>.</li>

  const wed = el("div","card pad");
  wed.innerHTML = `<div class="eyebrow">La última semana</div>
    <p class="note" style="margin-top:8px">Del 16 al 20 de febrero todo baja: sesiones cortas, sin llegar al fallo, y dos trotes suaves. Se llega descansada, no reventada. El viernes 19 no se entrena nada. El sábado 20 hay otra cosa que hacer.</p>`;

  document.getElementById("v-guia").append(intro, phases, rules, eq, push, health, wed);
}

/* ============================================================
   11. CABECERA Y PESTAÑAS
   ============================================================ */
function renderHeader(){
  const t = todayISO();
  const left = Math.max(0, diffDays(t, WEDDING));
  document.getElementById("cdays").textContent = left;
  const total = diffDays(START, WEDDING);
  const gone = Math.min(total, Math.max(0, diffDays(START, t)));
  const pct = Math.round((gone / total) * 100);
  document.getElementById("ptrack").style.width = pct + "%";
  const ph = phaseOf(t < START ? START : (t > WEDDING ? WEDDING : t));
  document.getElementById("pphase").textContent = PHASES[ph].name;
  document.getElementById("ppct").textContent = pct + "% del camino";
}
const TABS = ["hoy","plan","prog","guia"];
function switchTab(name){
  TABS.forEach(x => {
    const b = document.getElementById("tab-" + x), v = document.getElementById("v-" + x);
    const on = x === name;
    b.setAttribute("aria-selected", on ? "true" : "false");
    v.hidden = !on;
  });
  if (name === "guia") renderGuide();
}
TABS.forEach(x => { document.getElementById("tab-" + x).onclick = () => switchTab(x); });

function renderAll(){ renderHeader(); renderSession(); renderCalendar(); renderProgress(); }
load();
renderAll();
</script>
