<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="20 de febrero">
<meta name="description" content="Plan de fuerza y carrera hasta el 20 de febrero.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F3EFF0'/%3E%3Ctext y='.88em' x='10' font-size='78'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">
<title>Camino al 20 de Febrero</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3EFF0; --surface:#FFFFFF; --surface-2:#FAF7F8; --line:#E5DADE; --line-soft:#EFE7EA;
  --ink:#221A1E; --muted:#7A6A70; --faint:#A99AA0;
  --wine:#8E2F4A; --wine-soft:#F7E3E9; --wine-ink:#6E2239;
  --teal:#1C6B76; --teal-soft:#DEEDEF;
  --sage:#4E7C5B; --sage-soft:#E2EEE5;
  --amber:#9E6A15; --amber-soft:#F6EBD6;
  --shadow:0 1px 2px rgba(34,26,30,.05), 0 8px 24px -16px rgba(34,26,30,.25);
  --r:14px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151114; --surface:#1E181B; --surface-2:#241D21; --line:#31272B; --line-soft:#2A2226;
    --ink:#F0E7EA; --muted:#A3919A; --faint:#786870;
    --wine:#E5809A; --wine-soft:#3A222B; --wine-ink:#F2AFC0;
    --teal:#66B5C1; --teal-soft:#1B2E32;
    --sage:#8CBE9C; --sage-soft:#1E2B22;
    --amber:#D9A24A; --amber-soft:#2E2517;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#151114; --surface:#1E181B; --surface-2:#241D21; --line:#31272B; --line-soft:#2A2226;
  --ink:#F0E7EA; --muted:#A3919A; --faint:#786870;
  --wine:#E5809A; --wine-soft:#3A222B; --wine-ink:#F2AFC0;
  --teal:#66B5C1; --teal-soft:#1B2E32;
  --sage:#8CBE9C; --sage-soft:#1E2B22;
  --amber:#D9A24A; --amber-soft:#2E2517;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5;
  margin:0; padding:0 16px 120px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:600px;margin:0 auto}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* ---------- header ---------- */
header{padding-block:20px 12px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:23px;letter-spacing:-.01em}
.count{text-align:right;flex:none}
.count .n{font-family:"Fraunces",Georgia,serif;font-size:34px;font-weight:700;line-height:1;color:var(--wine);font-variant-numeric:tabular-nums}
.count .l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.track{height:5px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.track > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--wine))}
.trackmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:1 0 auto;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;
  padding:8px 13px;border-radius:99px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}

/* session head */
.shead{display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--line-soft)}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav .d{font-size:12.5px;color:var(--muted);font-weight:600}
.arrow{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;flex:none}
.arrow:hover{color:var(--ink);border-color:var(--faint)}
.arrow:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.stitle{font-size:25px;letter-spacing:-.015em}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:99px;text-transform:uppercase}
.pill.strength{background:var(--wine-soft);color:var(--wine-ink)}
.pill.run{background:var(--teal-soft);color:var(--teal)}
.pill.rest{background:var(--sage-soft);color:var(--sage)}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.done{background:var(--sage);color:#fff}
:root[data-theme="dark"] .pill.done,:root:not([data-theme="light"]) .pill.done{color:#15201A}

/* block */
.block{border-top:1px solid var(--line-soft)}
.block:first-of-type{border-top:0}
.blabel{display:flex;align-items:center;gap:8px;padding:13px 16px 4px}
.blabel .eyebrow{color:var(--faint)}
.blabel .mins{margin-left:auto;font-size:11px;color:var(--faint)}

.ex{display:flex;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft);align-items:flex-start}
.block .ex:first-of-type{border-top:0}
.ex.done .exname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.exmain{flex:1;min-width:0}
.exname{font-weight:600;font-size:14.5px;line-height:1.3;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.vid{
  display:inline-grid;place-items:center;width:21px;height:21px;border-radius:99px;flex:none;
  border:1px solid var(--line);background:var(--surface-2);color:var(--wine);
  font-size:8px;line-height:1;text-decoration:none;transition:background .15s,border-color .15s,transform .12s;
}
.vid:hover{background:var(--wine-soft);border-color:var(--wine);transform:scale(1.08)}
.vid:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.vid svg{width:9px;height:9px;display:block}
.exmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.exmeta b{color:var(--wine);font-weight:700;font-family:"IBM Plex Mono",monospace;font-size:12px}
.exnote{font-size:12px;color:var(--faint);margin-top:4px;line-height:1.4}
.exright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.sets{display:flex;gap:5px}
.setbtn{
  width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);
  cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--faint);
  display:grid;place-items:center;padding:0;transition:transform .12s,background .15s,border-color .15s,color .15s;
}
.setbtn:hover{border-color:var(--wine)}
.setbtn:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.setbtn[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff;transform:scale(.94)}
:root[data-theme="dark"] .setbtn[aria-pressed="true"],:root:not([data-theme="light"]) .setbtn[aria-pressed="true"]{color:#1B1013}
.wgt{display:flex;align-items:center;gap:4px}
.wgt input{
  width:52px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right;
}
.wgt input:focus{outline:2px solid var(--wine);outline-offset:1px}
.wgt span{font-size:10.5px;color:var(--faint)}

.runstep{display:flex;gap:11px;padding:9px 16px;border-top:1px solid var(--line-soft);align-items:baseline}
.block .runstep:first-of-type{border-top:0}
.runstep .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--teal);font-weight:600;flex:none;width:22px}
.runstep .v{font-size:14px;flex:1}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  color:var(--ink);font-family:inherit;font-size:14px;
}
.field input.mono{font-family:"IBM Plex Mono",monospace}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--wine);outline-offset:1px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:13px 16px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;
}
.btn:hover{opacity:.88}
.btn:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:var(--faint)}
.btn.isdone{background:var(--sage);border-color:var(--sage);color:#fff}
:root[data-theme="dark"] .btn.isdone,:root:not([data-theme="light"]) .btn.isdone{color:#121A14}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:10px;width:auto}

/* calendar */
.month{margin-bottom:6px}
.mname{font-family:"Fraunces",Georgia,serif;font-size:15px;font-weight:600;margin:0 0 8px;text-transform:capitalize}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.dow span{text-align:center;font-size:9.5px;color:var(--faint);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{
  aspect-ratio:1;border-radius:9px;border:1px solid transparent;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);padding:0;
}
.day.empty{background:transparent;cursor:default}
.day.out{opacity:.28;cursor:default}
.day .dot{width:5px;height:5px;border-radius:99px;background:var(--wine);opacity:.55}
.day.run .dot{background:var(--teal)}
.day.rest .dot{background:var(--sage)}
.day.done{background:var(--wine);color:#fff;border-color:var(--wine)}
.day.done.run{background:var(--teal);border-color:var(--teal)}
.day.done .dot{background:#fff;opacity:.85}
:root[data-theme="dark"] .day.done,:root:not([data-theme="light"]) .day.done{color:#1B1013}
:root[data-theme="dark"] .day.done .dot,:root:not([data-theme="light"]) .day.done .dot{background:#1B1013}
.day.today{border-color:var(--ink);border-width:2px}
.day:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);padding-top:4px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;vertical-align:middle}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:14px 10px;text-align:center}
.stat .v{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.05em;text-transform:uppercase}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding:0 2px}
.bars .b{flex:1;background:var(--wine-soft);border-radius:5px 5px 0 0;position:relative;min-height:3px;display:flex;justify-content:center}
.bars .b.last{background:var(--wine)}
.bars .b span{position:absolute;top:-16px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}
.barx{display:flex;gap:6px;padding:6px 2px 0}
.barx span{flex:1;text-align:center;font-size:9.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.row:first-child{border-top:0}
.row .rk{color:var(--muted);flex:1;min-width:0}
.row .rv{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;flex:none}

.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.note b{color:var(--ink)}
.callout{background:var(--amber-soft);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--ink)}
.callout .eyebrow{color:var(--amber);margin-bottom:3px;display:block}

/* timer bar */
.timerbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -18px rgba(0,0,0,.5);
  transform:translateY(110%);transition:transform .25s ease;
}
.timerbar.on{transform:translateY(0)}
.timerinner{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tnum{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;color:var(--wine);min-width:72px;font-variant-numeric:tabular-nums}
.tmeta{flex:1;min-width:0}
.tmeta .t1{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta .t2{font-size:11px;color:var(--muted)}
.tbtns{display:flex;gap:6px;flex:none}
.tbtns button{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.tbtns button:hover{color:var(--ink)}
.tbtns button:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

details.acc{border-top:1px solid var(--line-soft)}
details.acc summary{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";margin-left:auto;color:var(--faint);font-family:"IBM Plex Mono",monospace}
details.acc[open] summary::after{content:"–"}
details.acc .body{padding:0 16px 14px}
.card.pad > details.acc > summary{padding-left:0;padding-right:0}
.card.pad > details.acc > .body{padding-left:0;padding-right:0}

/* ---- consultar ---- */
.chat{display:flex;flex-direction:column;gap:9px;min-height:60px}
.msg{max-width:88%;padding:10px 13px;border-radius:15px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--wine);color:#fff;border-bottom-right-radius:5px}
:root[data-theme="dark"] .msg.me,:root:not([data-theme="light"]) .msg.me{color:#1B1013}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.err{align-self:stretch;max-width:100%;background:var(--amber-soft);font-size:13px;border-radius:12px}
.msg.wait{align-self:flex-start;color:var(--faint);font-style:italic}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.composer textarea{flex:1;resize:none;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14px;line-height:1.4;max-height:140px}
.composer textarea:focus{outline:2px solid var(--wine);outline-offset:1px}
.send{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;display:grid;place-items:center;font-size:17px}
.send:disabled{opacity:.4;cursor:default}
.send:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.prop{align-self:stretch;max-width:100%;border:1px solid var(--wine);background:var(--wine-soft);border-radius:14px;padding:13px}
.prop .eyebrow{color:var(--wine-ink)}
.prop ul{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.prop li{font-size:13.5px;line-height:1.35}
.prop li b{display:block;font-weight:700}
.prop li span{color:var(--muted);font-size:12.5px}
.prop .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.prop .acts button{padding:9px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--wine)}
.prop .acts .si{background:var(--wine);color:#fff;border-color:var(--wine)}
:root[data-theme="dark"] .prop .acts .si,:root:not([data-theme="light"]) .prop .acts .si{color:#1B1013}
.prop .acts .no{background:transparent;color:var(--wine-ink);border-color:transparent}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.suggest button{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:99px;padding:6px 11px;font-family:inherit;font-size:12px;cursor:pointer}
.suggest button:hover{color:var(--ink);border-color:var(--wine)}
.warn{background:var(--amber-soft);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5}
.warn b{display:block;margin-bottom:2px}
pre.report{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow-y:auto;margin:10px 0 0}
hr.sep{border:0;border-top:1px solid var(--line);margin:22px 0 16px}
footer{padding:26px 0 10px;text-align:center;font-size:11.5px;color:var(--faint);line-height:1.6}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){
  .exright{gap:5px}
  .setbtn{width:24px;height:24px}
  .count .n{font-size:30px}
}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brandrow">
      <div class="brand">
        <div class="eyebrow">Plan de fuerza y carrera</div>
        <h1>Camino al 20 de febrero</h1>
      </div>
      <div class="count">
        <div class="n mono" id="cdays">—</div>
        <div class="l">días para la boda</div>
      </div>
    </div>
    <div>
      <div class="track"><i id="ptrack" style="width:0%"></i></div>
      <div class="trackmeta"><span id="pphase">—</span><span id="ppct">—</span></div>

   1. CALENDARIO BASE
   ============================================================ */
const START = "2026-09-11";
const WEDDING = "2027-02-20";

const P3 = "2027-01-25";          // inicio fase 3
const FIRST_MONDAY = "2026-09-14";

const DAY = 86400000;
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const diffDays = (a,b) => Math.round((parseISO(b) - parseISO(a)) / DAY);
const addDays = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const todayISO = () => iso(new Date());

const DOW_LONG = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const fmtLong = s => { const d = parseISO(s); return cap(`${DOW_LONG[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`); };
const fmtShort = s => { const d = parseISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };

const isRunDay = s => { const w = parseISO(s).getDay(); return w === 1 || w === 4; };
const inPlan = s => diffDays(START, s) >= 0 && diffDays(s, WEDDING) >= 0;

function phaseOf(s){
  if (diffDays(s, P2) > 0) return 0;
  if (diffDays(s, P3) > 0) return 1;
  return 2;
}

  {name:"Fase 1 · Base", desc:"Aprender los patrones, tendones y técnica. Peso cómodo, repeticiones altas."},

/* Índice de la sesión de fuerza: cuenta los días que no son lunes ni jueves */
function strengthIndex(s){
  const n = diffDays(START, s);
  let c = 0;
  for (let i = 0; i < n; i++) if (!isRunDay(addDays(START, i))) c++;
  return c;                       // 0-based
}
function cycleInfo(s){
  const i = strengthIndex(s);
  return { session: (i % 10) + 1, cycle: Math.floor(i / 10) + 1, posInCycle: (i % 10) + 1 };
}
function runWeek(s){
  return Math.floor(diffDays(FIRST_MONDAY, s) / 7) + 1;   // 1-based
}

/* Lista efectiva de ejercicios de una sesión, ya con las modificaciones aplicadas */
function ejerciciosDe(n, sess){
  return sess.main.map(ex => {
    const o = (OV.ex || {})[n + ":" + ex.id];
    if (!o) return ex;
    if (o.off) return null;
    const nuevo = Object.assign({}, ex);
    if (o.n){ nuevo.n = o.n; nuevo.vq = o.n; }
    if (o.s){ nuevo.s = [o.s, o.s, o.s]; }
    if (o.r){ nuevo.r = [o.r, o.r, o.r]; }
    if (o.note != null) nuevo.note = o.note;
    nuevo.mod = true;
    return nuevo;
  }).filter(Boolean);
}

/* Qué toca realmente un día, después de las modificaciones */
function tipoDelDia(d){
  if (OV.moved && OV.moved[d]) return {tipo:"libre", movidaA: OV.moved[d]};
  const origen = Object.keys(OV.moved || {}).find(k => OV.moved[k] === d);
  if (origen) return {tipo:"carrera", desde: origen};
  if (OV.swap && OV.swap[d]) return {tipo: OV.swap[d] === "descanso" ? "descanso" : "suave"};
  if (SPECIAL[d]) return {tipo:"especial"};
  return {tipo: isRunDay(d) ? "carrera" : "fuerza"};
}

/* --- temporizador de descanso --- */
let timer = {left:0, id:null, label:""};
const bar = () => document.getElementById("timerbar");
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    const ctx = new Ctx(); const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type = "sine"; o.frequency.value = 740;
    g.gain.setValueAtTime(.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.22, ctx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .5);
    o.start(); o.stop(ctx.currentTime + .55);
    setTimeout(() => ctx.close(), 900);
  }catch(e){}
  if (navigator.vibrate) { try { navigator.vibrate([120, 60, 120]); } catch(e){} }
}
function paintTimer(){
  const m = Math.floor(timer.left / 60), sec = timer.left % 60;
  document.getElementById("tnum").textContent = `${m}:${String(sec).padStart(2,"0")}`;
}
function startRest(seconds, label){
  timer.left = seconds; timer.label = label;
  document.getElementById("tlabel").textContent = label;
  document.getElementById("tsub").textContent = "Descanso entre series";
  bar().classList.add("on"); paintTimer();
  clearInterval(timer.id);
  timer.id = setInterval(() => {
    timer.left--;
    if (timer.left <= 0){ clearInterval(timer.id); paintTimer(); beep();
      document.getElementById("tsub").textContent = "¡Siguiente serie!";
      setTimeout(() => bar().classList.remove("on"), 2500);
    } else paintTimer();
  }, 1000);
}
document.getElementById("tstop").onclick = () => { clearInterval(timer.id); bar().classList.remove("on"); };
document.getElementById("tplus").onclick = () => { timer.left += 15; paintTimer(); };

/* descanso recomendado según el ejercicio */
function restFor(ex, sess){
  if (sess && sess.circuit) return 40;
  if (sess && sess.easy) return 20;
  if (/s$/.test(String(ex.r[0])) || /\bs\b/.test(String(ex.r[0]))) return 45;
  return ["hip","hip2","goblet","goblet_p","rdl","bulgarian","row","pushup","ohp","sumo","stepup"].includes(ex.id) ? 75 : 50;
}

function buildStrength(card, d, ph, sess, ci){
  const st = dayState(d);

  /* calentamiento */
  const w = el("div","block");
  blockLabel(w, "Calentamiento", "3-4 min");
  sess.warm.forEach((t, i) => {
    const r = el("div","runstep");
    r.append(el("span","k","·"), el("span","v", t));
    w.append(r);
  });
  card.append(w);

  /* principal */
  const m = el("div","block");
  blockLabel(m, sess.circuit ? `Circuito · ${sess.circuit.rounds[ph]} vueltas` : "Bloque principal",
                sess.circuit ? `${sess.circuit.rest[ph]} entre vueltas` : sess.mins);
  const listaEx = ejerciciosDe(sess === SESSIONS[9] ? 10 : ci.session, sess);
  listaEx.forEach(ex => m.append(exerciseRow(ex, ph, sess, ci, st, d)));
  card.append(m);

  /* test de flexiones */
  if (listaEx.some(e => e.pu)){
    const t = el("div","block");
    blockLabel(t, "Test del ciclo");
    const row = el("div","ex");
    const main = el("div","exmain");
    main.append(el("div","exname","Máximo de flexiones completas seguidas"));
    main.append(el("div","exnote","Al final de la sesión, una serie al máximo con buena técnica. Se apunta y se compara ciclo a ciclo."));
    const right = el("div","exright");
    const wrap = el("div","wgt");
    const inp = el("input"); inp.type = "number"; inp.min = "0"; inp.inputMode = "numeric";
    inp.id = "test-" + d; inp.value = S.tests[d] != null ? S.tests[d] : "";
    inp.placeholder = "0";
    inp.oninput = () => { if (inp.value === "") delete S.tests[d]; else S.tests[d] = Math.max(0, parseInt(inp.value, 10) || 0); save(); renderProgress(); };
    wrap.append(inp, el("span","","reps"));
    right.append(wrap);
    row.append(main, right);
    t.append(row);
    card.append(t);
  }

  /* vuelta a la calma */
  const c = el("div","block");
  blockLabel(c, "Vuelta a la calma", "2-3 min");
  sess.cool.forEach(t => { const r = el("div","runstep"); r.append(el("span","k","·"), el("span","v", t)); c.append(r); });
  card.append(c);

  if (sess.tip){
    const dt = el("details","acc");
    dt.innerHTML = `<summary>Nota de esta sesión</summary><div class="body"><p class="note" style="margin:0">${sess.tip}</p></div>`;
    card.append(dt);
  }
}

function exerciseRow(ex, ph, sess, ci, st, d){
  const row = el("div","ex");
  const pu = ex.pu ? pushupFor(ci.cycle) : null;
  const name = pu ? pu.n : ex.n;
  const sets = pu ? pu.s : ex.s[ph];
  const reps = pu ? pu.r : ex.r[ph];
  const note = pu ? pu.note : ex.note;

  const done = st.c[ex.id] || 0;
  if (done >= sets) row.classList.add("done");

  const main = el("div","exmain");
  const nameRow = el("div","exname", name);
  const q = pu ? PUSH_VID[Math.min(ci.cycle, PUSH_VID.length) - 1] : (ex.vq || VID[ex.id]);
  if (q) nameRow.append(videoLink(q, name));
  if (ex.mod){ const bdg = el("span","pill ghost","ajustado"); bdg.style.fontSize = "9px"; nameRow.append(bdg); }
  main.append(nameRow);
  const meta = el("div","exmeta");
  meta.innerHTML = sess.circuit ? `<b>${reps}</b>` : `<b>${sets} × ${reps}</b>`;
  main.append(meta);
  if (note) main.append(el("div","exnote", note));

  const right = el("div","exright");
  const sbox = el("div","sets");
  for (let i = 1; i <= sets; i++){
    const b = el("button","setbtn", String(i));
    b.type = "button";
    b.setAttribute("aria-pressed", i <= done ? "true" : "false");
    b.setAttribute("aria-label", `Serie ${i} de ${name}`);
    b.onclick = () => {
      const cur = st.c[ex.id] || 0;
      st.c[ex.id] = (i === cur) ? i - 1 : i;
      save();
      if (st.c[ex.id] > cur && st.c[ex.id] < sets) startRest(restFor(ex, sess), name);
      else if (st.c[ex.id] >= sets) { toast("Ejercicio completo"); clearInterval(timer.id); bar().classList.remove("on"); }
      renderSession();
    };
    sbox.append(b);
  }
  right.append(sbox);

  if (ex.w){
    const wrap = el("div","wgt");
    const inp = el("input"); inp.type = "text"; inp.inputMode = "decimal";
    inp.id = "w-" + d + "-" + ex.id;
    inp.setAttribute("aria-label", "Peso usado en " + name);
    const dayW = (st.w || {})[ex.id];
    inp.value = dayW != null ? dayW : "";
    inp.placeholder = S.loads[ex.id] != null ? String(S.loads[ex.id]) : "—";
    inp.oninput = () => { (st.w ||= {})[ex.id] = inp.value; if (inp.value.trim()) S.loads[ex.id] = inp.value.trim(); save(); };
    wrap.append(inp, el("span","","kg"));
    right.append(wrap);
  }

  row.append(main, right);
  return row;
}

function buildRun(card, d, ph){

  if (r.note){
    const n = el("div","block");

    co.innerHTML = `<span class="eyebrow">Clave de la semana</span>${r.note}`;

  }

  const log = el("div","block");

function numField(label, unit, id, val, on){

}
function selField(label, id, val, on){

function renderCalendar(){
  const box = document.getElementById("v-plan");
  box.innerHTML = "";

  const lg = el("div","card pad");
  lg.innerHTML = `<div class="legend">
      <span><i style="background:var(--wine)"></i>Fuerza</span>
      <span><i style="background:var(--teal)"></i>Carrera</span>
      <span><i style="background:var(--sage)"></i>Día suave</span>
      <span><i style="background:var(--faint)"></i>Relleno = hecho</span>
    </div>`;
  box.append(lg);

  const first = parseISO(START), last = parseISO(WEDDING);
  let y = first.getFullYear(), m = first.getMonth();
  const card = el("div","card pad");
  const stack = el("div","stack");

  while (y < last.getFullYear() || (y === last.getFullYear() && m <= last.getMonth())){
    const mo = el("div","month");
    mo.append(el("h3","mname", `${cap(MONTHS[m])} ${y}`));
    const dow = el("div","dow");
    ["L","M","X","J","V","S","D"].forEach(x => dow.append(el("span","",x)));
    mo.append(dow);
    const grid = el("div","days");
    const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
    for (let i = 0; i < firstDow; i++) grid.append(el("div","day empty"));
    const dim = new Date(y, m + 1, 0).getDate();
    for (let dd = 1; dd <= dim; dd++){
      const ds = iso(new Date(y, m, dd));
      const b = el("button","day"); b.type = "button";
      b.append(el("span","", String(dd)));
      if (!inPlan(ds)){ b.classList.add("out"); b.disabled = true; }
      else {
        const sp = SPECIAL[ds];
        const T = tipoDelDia(ds);
        const run = T.tipo === "carrera";
        const ci = (run || sp || T.tipo === "libre" || T.tipo === "descanso" || T.tipo === "suave") ? null : cycleInfo(ds);
        const easy = ci && SESSIONS[ci.session - 1].easy;
        const suave = T.tipo === "suave" || T.tipo === "descanso" || T.tipo === "libre";
        b.classList.add(sp || suave ? "rest" : (run ? "run" : (easy ? "rest" : "str")));
        b.append(el("i","dot"));
        if ((S.days[ds] || {}).done) b.classList.add("done");
        if (ds === todayISO()) b.classList.add("today");
        b.setAttribute("aria-label", fmtLong(ds) + " · " + (sp ? sp.t :
          (T.tipo === "libre" ? "día libre" : T.tipo === "descanso" ? "descanso" :
           run ? "carrera" : T.tipo === "suave" ? "sesión suave" : SESSIONS[ci.session - 1].t)));
        b.onclick = () => { viewDate = ds; renderSession(); switchTab("hoy"); window.scrollTo({top:0, behavior:"smooth"}); };
      }
      grid.append(b);
    }
    mo.append(grid);
    stack.append(mo);
    m++; if (m > 11){ m = 0; y++; }
  }
  card.append(stack);
  box.append(card);

  const key = el("div","card pad");
  key.innerHTML = `<div class="eyebrow">Cómo está montado</div>
    <p class="note" style="margin:8px 0 0">Lunes y jueves, <b>carrera de una hora</b>. Los otros cinco días, una sesión de fuerza de 20-30 minutos. Las sesiones van en <b>ciclos de 10</b>: cuatro de piernas y glúteo, dos de abdomen, dos de tren superior, un circuito y un día suave de movilidad. Cuando acaba el ciclo vuelve a empezar con un poco más de peso o una repetición más.</p>`;
  box.append(key);
}

function streakCount(){
  let n = 0, d = todayISO();
  if (!(S.days[d] || {}).done) d = addDays(d, -1);
  while (inPlan(d) && (S.days[d] || {}).done){ n++; d = addDays(d, -1); }
  return n;
}
function streakText(){
  const n = streakCount();
  return n <= 1 ? "¡Hecho! Racha de 1 día" : `¡Hecho! Racha de ${n} días`;
}
function renderProgress(){
  const box = document.getElementById("v-prog");
  box.innerHTML = "";

  const doneDays = Object.keys(S.days).filter(k => S.days[k].done && inPlan(k));
  const runs = doneDays.filter(isRunDay);
  const strength = doneDays.filter(k => !isRunDay(k) && !SPECIAL[k]);
  let km = 0, mins = 0;
  Object.keys(S.days).forEach(k => {
    const r = S.days[k].run || {};
    const v = parseFloat(String(r.km || "").replace(",", ".")); if (!isNaN(v)) km += v;
    const t = parseFloat(String(r.min || "").replace(",", ".")); if (!isNaN(t)) mins += t;
  });

  const stats = el("div","stats");
  stats.append(statTile(streakCount(), "días de racha"), statTile(strength.length, "sesiones de fuerza"), statTile(runs.length, "carreras"));
  box.append(stats);

  const stats2 = el("div","stats");
  stats2.append(
    statTile(km ? km.toFixed(1) : "0", "km corridos"),
    statTile(mins ? Math.round(mins / 60) + " h" : "0 h", "corriendo"),
    statTile(cycleInfo(todayISO()).cycle > 12 ? 12 : cycleInfo(todayISO()).cycle, "ciclo actual")
  );
  box.append(stats2);

  /* ciclo actual */
  const ci = cycleInfo(todayISO());
  const cyCard = el("div","card pad");
  const cycStart = (() => { let d = START, seen = 0; while (inPlan(d)){ if (!isRunDay(d)){ if (Math.floor(seen / 10) + 1 === ci.cycle && seen % 10 === 0) return d; seen++; } d = addDays(d, 1); } return START; })();
  let cDone = 0, probe = cycStart, count = 0;
  while (inPlan(probe) && count < 10){
    if (!isRunDay(probe)){ if ((S.days[probe] || {}).done) cDone++; count++; }
    probe = addDays(probe, 1);
  }
  cyCard.innerHTML = `<div class="eyebrow">Ciclo ${ci.cycle} de 12</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin:6px 0 10px">
      <span class="mono" style="font-size:26px;font-weight:600">${cDone}/10</span>
      <span class="note">sesiones de fuerza completadas</span>
    </div>
    <div class="track"><i style="width:${cDone * 10}%"></i></div>`;
  box.append(cyCard);

  /* test de flexiones */
  const tks = Object.keys(S.tests || {}).filter(inPlan).sort();
  const puCard = el("div","card pad");
  puCard.append(el("div","eyebrow","Flexiones completas · test de cada ciclo"));
  if (tks.length === 0){
    const p = el("p","note","Todavía sin datos. El test se apunta en la sesión 3 de cada ciclo, la de empuje. Empezamos desde flexiones con rodillas y el objetivo es llegar a 5 completas seguidas antes de la boda.");
    p.style.margin = "8px 0 0"; puCard.append(p);
  } else {
    const vals = tks.map(k => S.tests[k]);
    const max = Math.max(5, ...vals);
    const bars = el("div","bars"); bars.style.marginTop = "18px";
    const xs = el("div","barx");
    tks.slice(-8).forEach((k, i, arr) => {
      const v = S.tests[k];
      const b = el("div","b" + (i === arr.length - 1 ? " last" : ""));
      b.style.height = Math.max(4, (v / max) * 88) + "px";
      b.append(el("span","", String(v)));
      bars.append(b);
      xs.append(el("span","", fmtShort(k)));
    });
    puCard.append(bars, xs);
  }
  box.append(puCard);

  /* pesos actuales */
  const lk = Object.keys(S.loads || {});
  if (lk.length){
    const lw = el("div","card pad");
    lw.append(el("div","eyebrow","Últimos pesos usados"));
    const rows = el("div","rows"); rows.style.marginTop = "6px";
    const names = {};
    SESSIONS.forEach(s => s.main.forEach(e => names[e.id] = e.n));
    lk.forEach(k => {
      const r = el("div","row");
      r.append(el("span","rk", names[k] || k), el("span","rv", S.loads[k] + " kg"));
      rows.append(r);
    });
    lw.append(rows);
    box.append(lw);
  }

  /* pasos y salud */
  const stCard = el("div","card pad");
  stCard.append(el("div","eyebrow","Pasos · últimos 7 días"));
  const last7 = []; for (let i = 6; i >= 0; i--) last7.push(addDays(todayISO(), -i));
  const svals = last7.map(k => (S.steps || {})[k] || 0);
  const sany = svals.some(v => v > 0);
  if (!sany){
    const p0 = el("p","note","Todavía sin pasos. Apúntalos cada día en la pestaña Hoy, o pega de golpe una semana entera desde la app Salud del iPhone con el botón de abajo. En la Guía está el atajo para que lo haga solo.");
    p0.style.margin = "8px 0 0"; stCard.append(p0);
  } else {
    const smax = Math.max(...svals);
    const media = Math.round(svals.filter(v => v > 0).reduce((a,b) => a+b, 0) / svals.filter(v => v > 0).length);
    const mrow = el("div",""); mrow.style.cssText = "display:flex;align-items:baseline;gap:8px;margin:6px 0 2px";
    const mv = el("span","mono", media.toLocaleString("es-ES")); mv.style.cssText = "font-size:26px;font-weight:600";
    mrow.append(mv, el("span","note","pasos de media al día"));
    stCard.append(mrow);
    const bars = el("div","bars"); bars.style.marginTop = "22px";
    const xs = el("div","barx");
    last7.forEach((k, i) => {
      const v = svals[i];
      const b = el("div","b" + (i === 6 ? " last" : ""));
      b.style.height = Math.max(4, (v / smax) * 88) + "px";
      if (v) b.append(el("span","", (v/1000).toFixed(1).replace(".0","") + "k"));
      bars.append(b);
      xs.append(el("span","", ["D","L","M","X","J","V","S"][parseISO(k).getDay()]));
    });
    stCard.append(bars, xs);
  }
  const impWrap = el("details","acc");
  impWrap.style.marginTop = "12px";
  const sum = el("summary","","Pegar datos de la app Salud");
  const bodyD = el("div","body");
  const tip = el("p","note","Una línea por día, con la fecha y los pasos. Vale <b>2026-09-11 8432</b> o <b>11/09/2026 8432</b>. Si pegas solo un número, se guarda en el día de hoy.");
  tip.style.margin = "0 0 8px";
  const tai = el("textarea"); tai.rows = 4; tai.id = "stepsimport";
  tai.placeholder = "11/09/2026 8432\n12/09/2026 10250";
  tai.style.cssText = "width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px";
  const impBtn = el("button","btn sm ghost","Importar pasos"); impBtn.type = "button";
  impBtn.style.cssText = "width:100%;margin-top:8px";
  impBtn.onclick = () => {
    const lines = tai.value.split(/\n+/).map(x => x.trim()).filter(Boolean);
    let n = 0;
    lines.forEach(line => {
      const m = line.match(/^(\d{4}-\d{2}-\d{2}|\d{1,2}[\/-]\d{1,2}[\/-]\d{4})\D+([\d.,\s]+)$/);
      if (m){
        let day = m[1];
        if (day.includes("/") || (day.includes("-") && day.length <= 10 && !/^\d{4}/.test(day))){
          const [dd, mm, yy] = day.split(/[\/-]/);
          day = `${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
        }
        const v = parseInt(m[2].replace(/\D/g,""), 10);
        if (!isNaN(v) && /^\d{4}-\d{2}-\d{2}$/.test(day)){ (S.steps ||= {})[day] = v; n++; }
      } else {
        const v = parseInt(line.replace(/\D/g,""), 10);
        if (!isNaN(v)){ (S.steps ||= {})[todayISO()] = v; n++; }
      }
    });
    if (n){ save(); tai.value = ""; renderProgress(); renderSession(); toast(n === 1 ? "1 día importado" : n + " días importados"); }
    else toast("No he reconocido ninguna línea");
  };
  bodyD.append(tip, tai, impBtn);
  impWrap.append(sum, bodyD);
  stCard.append(impWrap);
  box.append(stCard);

  /* compartir */
  const sh = el("div","card pad");
  sh.append(el("div","eyebrow","Compartir"));

  p.style.margin = "8px 0 12px";
  const btns = el("div","grid2");
  const b1 = el("button","btn sm ghost","Copiar resumen"); b1.type = "button";
  b1.onclick = () => {
    const txt = `Camino al 20 de febrero · ${fmtLong(todayISO())}\n`
      + `Racha: ${streakCount()} días\n`
      + `Fuerza: ${strength.length} sesiones · Carreras: ${runs.length}\n`
      + `Kilómetros: ${km.toFixed(1)} km\n`
      + `Ciclo ${ci.cycle}/12 — ${cDone}/10 sesiones\n`
      + (tks.length ? `Flexiones completas: ${S.tests[tks[tks.length-1]]}\n` : "")
      + `Faltan ${Math.max(0, diffDays(todayISO(), WEDDING))} días.`;
    copy(txt, "Resumen copiado");
  };
  const b2 = el("button","btn sm ghost","Copia de seguridad"); b2.type = "button";
  b2.onclick = () => copy(JSON.stringify(S), "Copia copiada. Pégala en el otro dispositivo con «Restaurar».");
  btns.append(b1, b2);
  const b3 = el("button","btn sm ghost","Restaurar desde una copia"); b3.type = "button";
  b3.style.width = "100%"; b3.style.marginTop = "10px";
  b3.onclick = () => {
    const t = window.prompt("Pega aquí la copia de seguridad:");
    if (!t) return;
    try { const o = JSON.parse(t); S = Object.assign({days:{}, loads:{}, tests:{}, steps:{}}, o); save(); renderAll(); toast("Historial restaurado"); }
    catch(e){ toast("Ese texto no es una copia válida"); }
  };
  sh.append(p, btns, b3);
  box.append(sh);
}
function statTile(v, k){
  const t = el("div","stat");
  t.append(el("div","v mono", String(v)), el("div","k", k));
  return t;
}
function copy(txt, ok){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => toast(ok), () => fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    try { document.execCommand("copy"); toast(ok); } catch(e){ toast("No se pudo copiar"); }
    ta.remove();
  }
}

function buildReport(){
  const hoy = todayISO();
  const dias = Math.max(1, diffDays(START, hoy) + 1);
  const L = [];
  const done = Object.keys(S.days).filter(k => S.days[k].done && inPlan(k) && diffDays(k, hoy) >= 0);
  const doneS = done.filter(k => !isRunDay(k) && !SPECIAL[k]);
  const doneR = done.filter(isRunDay);

  let tocanS = 0, tocanR = 0;
  for (let i = 0; i < dias; i++){
    const d = addDays(START, i);
    if (!inPlan(d) || SPECIAL[d]) continue;
    if (isRunDay(d)) tocanR++; else tocanS++;
  }
  const pc = (a, b) => b ? Math.round((a / b) * 100) + "%" : "—";
  const dias_ = n => n + (n === 1 ? " día" : " días");

  L.push("RESUMEN DE ENTRENAMIENTO");
  L.push("Periodo: " + fmtLong(START) + " a " + fmtLong(hoy) + "  (" + dias_(dias) + ")");
  L.push("Boda el 20 de febrero de 2027: faltan " + dias_(Math.max(0, diffDays(hoy, WEDDING))) + ".");
  L.push("Plan: 5 sesiones de fuerza de 20-30 min por semana en ciclos de 10, más carrera de 1 h lunes y jueves.");
  L.push("Objetivos: masa muscular y fuerza, glúteo y piernas, abdomen, y llegar a hacer flexiones completas.");
  L.push("Material: mancuernas regulables y bandas elásticas, en casa.");
  L.push("");
  L.push("CUMPLIMIENTO");
  L.push("  Fuerza:   " + doneS.length + " de " + tocanS + (tocanS === 1 ? " sesión (" : " sesiones (") + pc(doneS.length, tocanS) + ")");
  L.push("  Carreras: " + doneR.length + " de " + tocanR + " (" + pc(doneR.length, tocanR) + ")");
  L.push("  Racha actual: " + dias_(streakCount()));
  const ci = cycleInfo(hoy);
  L.push("  Va por el ciclo " + ci.cycle + " de 12, sesión " + ci.session + " · " + PHASES[phaseOf(hoy)].name);
  L.push("");

  const porSesion = {};
  for (let i = 0; i < dias; i++){
    const d = addDays(START, i);
    if (!inPlan(d) || isRunDay(d) || SPECIAL[d]) continue;
    const n = cycleInfo(d).session;
    porSesion[n] = porSesion[n] || [0, 0];
    porSesion[n][1]++;
    if ((S.days[d] || {}).done) porSesion[n][0]++;
  }
  L.push("POR TIPO DE SESIÓN (hechas / tocaban)");
  Object.keys(porSesion).sort((a,b) => a-b).forEach(n => {
    L.push("  S" + n + " " + SESSIONS[n-1].t + ": " + porSesion[n][0] + "/" + porSesion[n][1]);
  });
  L.push("");

  const lk = Object.keys(S.loads || {});
  if (lk.length){
    const names = {};
    SESSIONS.forEach(x => x.main.forEach(e => names[e.id] = e.n));
    L.push("ÚLTIMOS PESOS USADOS");
    lk.forEach(k => L.push("  " + (names[k] || k) + ": " + S.loads[k] + " kg"));
    L.push("");
  }

  const tks = Object.keys(S.tests || {}).filter(inPlan).sort();
  L.push("TEST DE FLEXIONES COMPLETAS");
  L.push(tks.length ? "  " + tks.map(k => fmtShort(k) + ": " + S.tests[k]).join("  ·  ") : "  sin datos todavía");
  L.push("");

  let km = 0, mins = 0, sens = {bien:0, normal:0, dura:0};
  Object.keys(S.days).forEach(k => {
    const r = S.days[k].run || {};
    const a = parseFloat(String(r.km || "").replace(",", ".")); if (!isNaN(a)) km += a;
    const b = parseFloat(String(r.min || "").replace(",", ".")); if (!isNaN(b)) mins += b;
    if (r.feel && sens[r.feel] != null) sens[r.feel]++;
  });
  L.push("CARRERAS");
  L.push("  " + doneR.length + " salidas · " + km.toFixed(1).replace(".", ",") + " km · " +
         Math.floor(mins/60) + " h " + Math.round(mins%60) + " min");
  L.push("  Sensaciones: bien " + sens.bien + ", normal " + sens.normal + ", dura " + sens.dura);
  L.push("");

  const sk = Object.keys(S.steps || {}).filter(k => S.steps[k]);
  if (sk.length){
    const med = Math.round(sk.reduce((a,k) => a + S.steps[k], 0) / sk.length);
    L.push("PASOS");
    L.push("  Media de " + med.toLocaleString("es-ES") + " al día en " + sk.length + " días registrados");
    L.push("");
  }

  const notas = Object.keys(S.days).filter(k => (S.days[k].note || "").trim()).sort();
  if (notas.length){
    L.push("NOTAS DEL DÍA A DÍA");
    notas.slice(-20).forEach(k => L.push("  " + fmtShort(k) + ": " + S.days[k].note.trim().replace(/\s+/g, " ")));
    L.push("");
  }
  if ((OV.log || []).length){
    L.push("CAMBIOS APLICADOS AL PLAN");
    OV.log.slice(-25).forEach(x => L.push("  " + x.f + " · " + x.t));
    L.push("");
  }
  if (planNote.trim()){
    L.push("AJUSTES QUE YA TIENE ANOTADOS");
    planNote.trim().split(/\n+/).forEach(x => L.push("  " + x));
    L.push("");
  }
  return L.join("\n");
}

function nombreEjercicio(sesion, id){
  const sess = SESSIONS[sesion - 1];
  if (!sess) return id;
  const e = sess.main.find(x => x.id === id);
  const o = (OV.ex || {})[sesion + ":" + id];
  return (o && o.n) || (e && e.n) || id;
}

function describirHerramienta(name, a){
  const n = () => nombreEjercicio(a.sesion, a.ejercicio);
  const s = () => "S" + a.sesion + " " + (SESSIONS[a.sesion - 1] ? SESSIONS[a.sesion - 1].t : "");
  switch(name){
    case "ajustar_ejercicio": {
      const cambios = [];
      if (a.series) cambios.push(a.series + " series");
      if (a.reps) cambios.push(a.reps + " repeticiones");
      return {t:"Ajustar " + n(), d: s() + " · pasa a " + cambios.join(" y ")};
    }
    case "cambiar_ejercicio":
      return {t:"Cambiar " + n() + " por " + a.nuevo_nombre, d: s() + " · " + a.series + " × " + a.reps};
    case "quitar_ejercicio":  return {t:"Quitar " + n(), d: s()};
    case "restaurar_ejercicio": return {t:"Restaurar " + n(), d: s() + " · vuelve al plan original"};
    case "cambiar_sesion_del_dia":
      return {t: (a.tipo === "descanso" ? "Descanso" : "Sesión suave") + " el " + (inPlan(a.fecha) ? fmtLong(a.fecha) : a.fecha), d:"Solo ese día"};
    case "mover_carrera":
      return {t:"Mover la carrera", d: (inPlan(a.fecha_original) ? fmtShort(a.fecha_original) : a.fecha_original) + " → " + (inPlan(a.fecha_nueva) ? fmtLong(a.fecha_nueva) : a.fecha_nueva)};
    case "anotar_ajuste": return {t:"Anotar en ajustes en vigor", d: a.texto};
    case "volver_al_plan_original": return {t:"Volver al plan original", d:"Se borran todas las modificaciones"};
    default: return {t:name, d:""};
  }
}

function aplicarHerramienta(name, a){
  const clave = a.sesion + ":" + a.ejercicio;
  const sess = SESSIONS[a.sesion - 1];

  const validaEjercicio = () => {
    if (!sess) return "Esa sesión no existe. Van de la 1 a la 10.";
    if (a.sesion === SESION_PROTEGIDA) return "La sesión 10 es el día de descarga del ciclo y no se toca.";
    if (a.ejercicio === EJERCICIO_PROTEGIDO) return "Las flexiones siguen su propia progresión y no se pueden cambiar desde aquí.";
    if (!sess.main.some(x => x.id === a.ejercicio)) return "En esa sesión no hay ningún ejercicio con ese identificador.";
    return null;
  };

  switch(name){
    case "ajustar_ejercicio": {
      const err = validaEjercicio(); if (err) return {ok:false, msg:err};
      if (a.series != null && (a.series < 1 || a.series > 6)) return {ok:false, msg:"Las series tienen que estar entre 1 y 6."};
      if (a.reps != null && String(a.reps).length > 24) return {ok:false, msg:"Las repeticiones son demasiado largas."};
      const o = (OV.ex[clave] = Object.assign({}, OV.ex[clave]));
      if (a.series != null) o.s = a.series;
      if (a.reps != null) o.r = String(a.reps);
      delete o.off;
      ovLog("Ajustado " + nombreEjercicio(a.sesion, a.ejercicio) + " (S" + a.sesion + "): " + (a.motivo || ""));
      return {ok:true, msg:"Aplicado."};
    }
    case "cambiar_ejercicio": {
      const err = validaEjercicio(); if (err) return {ok:false, msg:err};
      if (!a.nuevo_nombre || a.nuevo_nombre.length > 60) return {ok:false, msg:"El nombre del ejercicio no vale."};
      if (a.series < 1 || a.series > 6) return {ok:false, msg:"Las series tienen que estar entre 1 y 6."};
      const anterior = nombreEjercicio(a.sesion, a.ejercicio);
      OV.ex[clave] = {n:a.nuevo_nombre, s:a.series, r:String(a.reps), note:a.nota || ""};
      ovLog("Cambiado " + anterior + " por " + a.nuevo_nombre + " (S" + a.sesion + "): " + (a.motivo || ""));
      return {ok:true, msg:"Aplicado."};
    }
    case "quitar_ejercicio": {
      const err = validaEjercicio(); if (err) return {ok:false, msg:err};
      const quedan = ejerciciosDe(a.sesion, sess).filter(x => x.id !== a.ejercicio).length;
      if (quedan < 3) return {ok:false, msg:"No puedo: la sesión se quedaría con menos de tres ejercicios. Ajusta las series en vez de quitarlo."};
      OV.ex[clave] = Object.assign({}, OV.ex[clave], {off:true});
      ovLog("Quitado " + nombreEjercicio(a.sesion, a.ejercicio) + " (S" + a.sesion + "): " + (a.motivo || ""));
      return {ok:true, msg:"Aplicado."};
    }
    case "restaurar_ejercicio": {
      if (!sess) return {ok:false, msg:"Esa sesión no existe."};
      const nom = nombreEjercicio(a.sesion, a.ejercicio);
      delete OV.ex[clave];
      ovLog("Restaurado " + nom + " (S" + a.sesion + ")");
      return {ok:true, msg:"Restaurado."};
    }
    case "cambiar_sesion_del_dia": {
      if (!inPlan(a.fecha)) return {ok:false, msg:"Esa fecha está fuera del plan."};
      if (diffDays(todayISO(), a.fecha) < -1) return {ok:false, msg:"No se cambian días que ya han pasado."};
      if (diffDays(todayISO(), a.fecha) > 10) return {ok:false, msg:"Solo se pueden cambiar días de los próximos diez."};
      OV.swap[a.fecha] = a.tipo === "descanso" ? "descanso" : "suave";
      ovLog((a.tipo === "descanso" ? "Descanso" : "Sesión suave") + " el " + a.fecha + ": " + (a.motivo || ""));
      return {ok:true, msg:"Aplicado."};
    }
    case "mover_carrera": {
      if (!inPlan(a.fecha_original) || !inPlan(a.fecha_nueva)) return {ok:false, msg:"Alguna de las fechas está fuera del plan."};
      if (!isRunDay(a.fecha_original)) return {ok:false, msg:"Ese día no había carrera: las carreras son los lunes y los jueves."};
      if (isRunDay(a.fecha_nueva)) return {ok:false, msg:"Ese día ya tiene carrera. Elige un día que no sea lunes ni jueves."};
      if (Math.abs(diffDays(a.fecha_original, a.fecha_nueva)) > 3) return {ok:false, msg:"Muévela como mucho tres días."};
      OV.moved[a.fecha_original] = a.fecha_nueva;
      ovLog("Carrera del " + a.fecha_original + " movida al " + a.fecha_nueva + ": " + (a.motivo || ""));
      return {ok:true, msg:"Aplicado."};
    }
    case "anotar_ajuste": {
      if (!a.texto || a.texto.length > 200) return {ok:false, msg:"La nota no vale."};
      planNote = (planNote ? planNote.trim() + "\n" : "") + a.texto.trim();
      try { localStorage.setItem("boda2027.ajustes", planNote); } catch(e){}
      ovLog("Nota: " + a.texto);
      return {ok:true, msg:"Anotado."};
    }
    case "volver_al_plan_original": {
      OV = {ex:{}, swap:{}, moved:{}, log:[{f:todayISO(), t:"Vuelta al plan original"}]};
      return {ok:true, msg:"Plan original restaurado."};
    }
  }
  return {ok:false, msg:"Herramienta desconocida."};
}

function catalogo(){
  const L = ["CATÁLOGO DE SESIONES — usa estos identificadores en las herramientas:"];
  SESSIONS.forEach((x, i) => {
    const n = i + 1;
    if (n === SESION_PROTEGIDA){ L.push("  S10 " + x.t + " — protegida, no se toca."); return; }
    L.push("  S" + n + " " + x.t + ": " + x.main.map(e => e.id + " (" + nombreEjercicio(n, e.id) + ")").join(", "));
  });
  const mods = Object.keys(OV.ex || {});
  if (mods.length || Object.keys(OV.swap||{}).length || Object.keys(OV.moved||{}).length){
    L.push("");
    L.push("MODIFICACIONES YA APLICADAS:");
    (OV.log || []).slice(-15).forEach(x => L.push("  " + x.f + " · " + x.t));
  }
  return L.join("\n");
}

async function askClaude(mensajes){
  const body = {
    model: AI.model || "claude-sonnet-5",
    max_tokens: 1400,
    system: systemPrompt(),
    tools: TOOLS,
    messages: mensajes
  };
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key": AI.key,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body: JSON.stringify(body)
    });
  } catch(e){
    throw new Error("No he podido conectar. Si has abierto la app dentro de Claude, las conexiones externas están bloqueadas ahí: usa el enlace de GitHub. Si no, revisa la conexión.");
  }
  const j = await res.json().catch(() => null);
  if (!res.ok){
    const m = j && j.error && j.error.message ? j.error.message : ("Error " + res.status);
    if (res.status === 401) throw new Error("La clave no es válida o ha sido revocada.");
    if (res.status === 429) throw new Error("Demasiadas preguntas seguidas. Espera un minuto y vuelve a intentarlo.");
    if (res.status === 400 && /model/i.test(m)) throw new Error("Ese modelo no está disponible con esta clave. Prueba a cambiarlo arriba.");
    if (res.status === 402 || /credit|balance/i.test(m)) throw new Error("La cuenta de la clave se ha quedado sin saldo.");
    throw new Error(m);
  }
  return j;
}

function renderConsultar(){
  const box = document.getElementById("v-chat");
  box.innerHTML = "";

  /* ---- informe ---- */
  const rep = el("div","card pad");
  rep.append(el("div","eyebrow","Para revisar el plan"));
  const h = el("h3","", "Resumen de cómo va"); h.style.cssText = "font-size:19px;margin:8px 0 8px";
  const p1 = el("p","note","Cada tres o cuatro semanas, copia esto y pásaselo a Juande o pégalo directamente en Claude: lleva el cumplimiento, los pesos, el test de flexiones, las carreras y tus notas, que es justo lo que hace falta para ajustar el plan.");
  p1.style.margin = "0 0 12px";
  rep.append(h, p1);

  const g = el("div","grid2");
  const b1 = el("button","btn sm ghost","Copiar resumen"); b1.type = "button";
  b1.onclick = () => copy(buildReport(), "Resumen copiado");
  const b2 = el("button","btn sm ghost","Descargar .txt"); b2.type = "button";
  b2.onclick = () => descargar(buildReport(), "entreno-" + todayISO() + ".txt");
  g.append(b1, b2);
  const b3 = el("button","btn sm ghost","Copia completa de los datos (JSON)"); b3.type = "button";
  b3.style.cssText = "width:100%;margin-top:8px";
  b3.onclick = () => copy(JSON.stringify(S), "Copia completa copiada");
  rep.append(g, b3);

  const prev = el("details","acc"); prev.style.marginTop = "12px";
  const psum = el("summary","","Ver el resumen");
  const pbody = el("div","body");
  const pre = el("pre","report", buildReport());
  pbody.append(pre); prev.append(psum, pbody);
  rep.append(prev);
  box.append(rep);

  /* ---- ajustes en vigor ---- */
  const adj = el("div","card pad");
  adj.append(el("div","eyebrow","Ajustes en vigor"));
  const p2 = el("p","note","Lo que escribas aquí te aparecerá cada día encima de la sesión. Sirve para los cambios acordados: menos series en un ejercicio, bajar peso, mover un día de carrera…");
  p2.style.margin = "8px 0 10px";
  const ta2 = el("textarea"); ta2.id = "ajustes"; ta2.rows = 3;
  ta2.placeholder = "Ej.: hip thrust a 3 series hasta que no moleste la cadera";
  ta2.style.cssText = "width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14px";
  ta2.value = planNote;
  ta2.oninput = () => { planNote = ta2.value; try { localStorage.setItem("boda2027.ajustes", planNote); } catch(e){} renderSession(); };
  adj.append(p2, ta2);
  box.append(adj);

  /* ---- modificaciones activas ---- */
  const activas = [];
  Object.keys(OV.ex || {}).forEach(k => {
    const [sn, id] = k.split(":"); const o = OV.ex[k];
    const base = (SESSIONS[sn-1] || {main:[]}).main.find(x => x.id === id);
    if (!base) return;
    let d;
    if (o.off) d = "quitado";
    else if (o.n) d = "en vez de " + base.n + " · " + o.s + " × " + o.r;
    else d = (o.s || base.s[phaseOf(todayISO())]) + " × " + (o.r || base.r[phaseOf(todayISO())]) + " (original: " + base.s[phaseOf(todayISO())] + " × " + base.r[phaseOf(todayISO())] + ")";
    activas.push({k, t:"S" + sn + " · " + (o.n || base.n), d, quitar:() => { delete OV.ex[k]; ovLog("Restaurado " + base.n + " (S" + sn + ")"); }});
  });
  Object.keys(OV.swap || {}).forEach(f => activas.push({
    k:"swap:"+f, t: fmtLong(f), d: OV.swap[f] === "descanso" ? "descanso total" : "sesión suave de movilidad",
    quitar:() => { delete OV.swap[f]; }
  }));
  Object.keys(OV.moved || {}).forEach(f => activas.push({
    k:"mov:"+f, t:"Carrera del " + fmtShort(f), d:"movida al " + fmtLong(OV.moved[f]),
    quitar:() => { delete OV.moved[f]; }
  }));

  if (activas.length){
    const m = el("div","card pad");
    m.append(el("div","eyebrow","Modificaciones del plan"));
    const rows = el("div","rows"); rows.style.marginTop = "6px";
    activas.forEach(x => {
      const r = el("div","row"); r.style.alignItems = "flex-start";
      const left = el("div",""); left.style.flex = "1";
      const t = el("div","", x.t); t.style.fontWeight = "600";
      left.append(t, el("div","note", x.d));
      const b = el("button","","Quitar"); b.type = "button";
      b.style.cssText = "border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:8px;padding:5px 9px;font-family:inherit;font-size:11.5px;cursor:pointer;flex:none";
      b.onclick = () => { x.quitar(); ovSave(); renderAll(); renderConsultar(); toast("Quitado"); };
      r.append(left, b); rows.append(r);
    });
    m.append(rows);
    const reset = el("button","btn sm ghost","Volver al plan original"); reset.type = "button";
    reset.style.cssText = "width:100%;margin-top:12px";
    reset.onclick = () => {
      if (!window.confirm("¿Deshacer todas las modificaciones y volver al plan original?")) return;
      OV = {ex:{}, swap:{}, moved:{}, log:[{f:todayISO(), t:"Vuelta al plan original"}]};
      ovSave(); renderAll(); renderConsultar(); toast("Plan original restaurado");
    };
    m.append(reset);
    box.append(m);
  }

  /* ---- chat ---- */
  const c = el("div","card pad");
  c.append(el("div","eyebrow","Preguntar a Claude"));

  if (!AI.key){
    const h2 = el("h3","","Resolver dudas sin esperar"); h2.style.cssText = "font-size:19px;margin:8px 0 8px";
    const p3 = el("p","note","Con una clave de la API de Anthropic puedes preguntarle aquí mismo lo que quieras sobre el plan —cómo se hace un ejercicio, cambiar un día, bajar carga— y responde sabiendo cómo llevas el mes.");
    p3.style.margin = "0 0 12px";
    const w = el("div","warn");
    w.innerHTML = "<b>Antes de ponerla</b>La clave es de pago (céntimos por pregunta) y se guarda solo en este móvil, nunca se sube a ningún sitio. Aun así, cualquiera que coja el móvil desbloqueado podría usarla: ponle un límite de gasto en la consola de Anthropic y bórrala si el móvil se pierde.";
    const b = el("button","btn","Añadir clave"); b.type = "button"; b.style.marginTop = "12px";
    b.onclick = pedirClave;
    c.append(h2, p3, w, b);
    box.append(c);
    return;
  }

  const bar = el("div",""); bar.style.cssText = "display:flex;gap:8px;align-items:center;margin:8px 0 12px";
  const sel = el("select"); sel.id = "modelo";
  sel.style.cssText = "flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:12.5px";
  [["claude-sonnet-5","Sonnet 5 · equilibrado"],["claude-haiku-4-5-20251001","Haiku 4.5 · rápido y barato"],["claude-opus-5","Opus 5 · el más listo"]]
    .forEach(([v,t]) => { const o = el("option","",t); o.value = v; if (AI.model === v) o.selected = true; sel.append(o); });
  if (!sel.value) sel.value = "claude-sonnet-5";
  sel.onchange = () => { AI.model = sel.value; aiSave(); };
  const bk = el("button","sync","Cambiar clave"); bk.type = "button"; bk.onclick = pedirClave;
  bar.append(sel, bk);
  c.append(bar);

  const chat = el("div","chat"); chat.id = "chatbox";
  if (!AI.chat.length){
    const m = el("div","msg ai","Cuéntame. ¿Alguna duda con un ejercicio, quieres mover un día o bajar el peso de algo?");
    chat.append(m);
  } else {
    AI.chat.forEach(m => {
      const t = textoDe(m);
      if (t) chat.append(el("div","msg " + (m.role === "user" ? "me" : "ai"), t));
    });
  }
  c.append(chat);

  const comp = el("div","composer");
  const ta = el("textarea"); ta.id = "pregunta"; ta.rows = 1; ta.placeholder = "Escribe tu duda…";
  const send = el("button","send","↑"); send.type = "button"; send.setAttribute("aria-label","Enviar");
  ta.oninput = () => { ta.style.height = "auto"; ta.style.height = Math.min(140, ta.scrollHeight) + "px"; };
  ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); enviar(); } };
  send.onclick = enviar;
  comp.append(ta, send);
  c.append(comp);

  const sug = el("div","suggest");
  ["¿Cómo voy este mes?","Me molesta la rodilla en las zancadas","Quiero mover la carrera del jueves","¿Subo peso en el hip thrust?"]
    .forEach(t => { const b = el("button","",t); b.type = "button"; b.onclick = () => { ta.value = t; enviar(); }; sug.append(b); });
  c.append(sug);

  const clear = el("button","btn sm ghost","Borrar la conversación"); clear.type = "button";
  clear.style.cssText = "width:100%;margin-top:12px";
  clear.onclick = () => { AI.chat = []; aiSave(); renderConsultar(); };
  c.append(clear);
  box.append(c);

  async function enviar(){
    const texto = ta.value.trim();
    if (!texto) return;
    ta.value = ""; ta.style.height = "auto"; send.disabled = true;
    chat.append(el("div","msg me", texto));
    AI.chat.push({role:"user", content:texto});
    await turno();
  }

  async function turno(){
    const esperando = el("div","msg wait","Pensando…");
    chat.append(esperando);
    esperando.scrollIntoView({block:"nearest"});
    try {
      const j = await askClaude(recortar(AI.chat));
      esperando.remove();
      const txt = (j.content || []).filter(x => x.type === "text").map(x => x.text).join("\n").trim();
      if (txt) chat.append(el("div","msg ai", txt));
      AI.chat.push({role:"assistant", content:j.content || []});
      AI.chat = AI.chat.slice(-20); aiSave();
      const usos = (j.content || []).filter(x => x.type === "tool_use");
      if (usos.length) propuesta(usos);
    } catch(err){
      esperando.remove();
      chat.append(el("div","msg err", String(err.message || err)));
    }
    send.disabled = false;
    if (chat.lastChild) chat.lastChild.scrollIntoView({block:"nearest"});
  }

  function propuesta(usos){
    send.disabled = true;
    const box2 = el("div","msg prop");
    box2.append(el("div","eyebrow", usos.length === 1 ? "Cambio propuesto" : "Cambios propuestos"));
    const ul = el("ul");
    usos.forEach(u => {
      const d = describirHerramienta(u.name, u.input || {});
      const li = el("li");
      li.append(el("b","", d.t));
      if (d.d) li.append(el("span","", d.d));
      ul.append(li);
    });
    box2.append(ul);
    const acts = el("div","acts");
    const si = el("button","si","Aplicar"); si.type = "button";
    const no = el("button","no","Ahora no"); no.type = "button";
    acts.append(si, no); box2.append(acts);
    chat.append(box2);
    box2.scrollIntoView({block:"nearest"});

    const cerrar = resultados => {
      acts.remove();
      AI.chat.push({role:"user", content: resultados});
      AI.chat = AI.chat.slice(-20);
      turno();
    };

    si.onclick = () => {
      const res = usos.map(u => {
        const r = aplicarHerramienta(u.name, u.input || {});
        return {type:"tool_result", tool_use_id:u.id, content: r.msg, is_error: !r.ok};
      });
      ovSave();
      const fallos = res.filter(x => x.is_error).length;
      box2.append(el("div","note", fallos ? "Algún cambio no se ha podido aplicar." : "Aplicado ✓"));
      box2.lastChild.style.marginTop = "10px";
      renderAll();
      toast(fallos ? "Aplicado con avisos" : "Plan actualizado");
      cerrar(res);
    };
    no.onclick = () => {
      const res = usos.map(u => ({type:"tool_result", tool_use_id:u.id, content:"La usuaria ha descartado este cambio."}));
      box2.append(el("div","note","Descartado"));
      box2.lastChild.style.marginTop = "10px";
      cerrar(res);
    };
  }
}

function textoDe(m){
  if (typeof m.content === "string") return m.content;
  if (Array.isArray(m.content)) return m.content.filter(x => x.type === "text").map(x => x.text).join("\n").trim();
  return "";
}
/* La conversación no puede empezar por una respuesta de herramienta */
function recortar(msgs){
  let out = msgs.slice(-20);
  while (out.length && !(out[0].role === "user" && typeof out[0].content === "string")) out = out.slice(1);
  return out.length ? out : msgs.slice(-1);
}

function pedirClave(){
  const k = window.prompt("Pega la clave de la API de Anthropic (empieza por sk-ant-). Déjalo vacío para borrarla de este móvil.", AI.key ? "" : "");
  if (k === null) return;
  if (!k.trim()){ AI.key = ""; AI.chat = []; aiSave(); renderConsultar(); toast("Clave borrada"); return; }
  if (!/^sk-ant-/.test(k.trim())){ toast("Esa clave no tiene la pinta habitual"); }
  AI.key = k.trim(); aiSave(); renderConsultar(); toast("Clave guardada en este móvil");
}

/* ============================================================
   11. CABECERA Y PESTAÑAS
   ============================================================ */
function renderHeader(){
  const t = todayISO();
  const left = Math.max(0, diffDays(t, WEDDING));
  document.getElementById("cdays").textContent = left;
  const total = diffDays(START, WEDDING);
  const gone = Math.min(total, Math.max(0, diffDays(START, t)));
  const pct = Math.round((gone / total) * 100);
  document.getElementById("ptrack").style.width = pct + "%";
  const ph = phaseOf(t < START ? START : (t > WEDDING ? WEDDING : t));
  document.getElementById("pphase").textContent = PHASES[ph].name;
  document.getElementById("ppct").textContent = pct + "% del camino";
}
const TABS = ["hoy","plan","prog","chat","guia"];
function switchTab(name){
  TABS.forEach(x => {
    const b = document.getElementById("tab-" + x), v = document.getElementById("v-" + x);
    const on = x === name;
    b.setAttribute("aria-selected", on ? "true" : "false");
    v.hidden = !on;
  });
  if (name === "guia") renderGuide();
  if (name === "chat") renderConsultar();
}
TABS.forEach(x => { document.getElementById("tab-" + x).onclick = () => switchTab(x); });

function renderAll(){ renderHeader(); renderSession(); renderCalendar(); renderProgress(); }
load();
renderAll();
